const BB={wk:null,rows:[],at:0,busy:false};
async function loadBoss(){ if(!SB||!ONLINE.user||!state||BB.busy) return; BB.busy=true;
  try{ const wk=weekKey(); const {data,error}=await SB.from('world_boss_hits').select('char_id,name,cls,level,dmg').eq('week',wk).limit(20000); BB.at=now(); if(error){ console.warn(error); return; }
    const m={}; for(const h of data){ const r=m[h.char_id]||(m[h.char_id]={key:'p-'+h.char_id,cid:h.char_id,name:h.name,cls:h.cls,level:h.level,dmg:0}); r.dmg+=h.dmg; r.level=Math.max(r.level,h.level); }
    BB.rows=Object.values(m); BB.wk=wk; if(view==='arena'&&arenaTab==='boss'&&!battle) render(); }
  finally{ BB.busy=false; } }
function bossBoard(){ const wk=weekKey(); if(BB.wk!==wk||now()-BB.at>20000) setTimeout(loadBoss,0);
  const rows=(BB.wk===wk?BB.rows:[]).map(r=>({...r,me:r.cid===state.cid})), local=(state.bossDmg&&state.bossDmg[wk])||0, mine=rows.find(r=>r.me);
  if(mine) mine.dmg=Math.max(mine.dmg,local); else if(local) rows.push({key:'me',cid:state.cid,name:state.name,cls:state.cls,level:state.level,dmg:local,me:true});
  return bossBoardOf(rows); }
async function recordBossHit(dealt){ const wk=weekKey(); state.bossDmg=state.bossDmg||{}; state.bossDmg[wk]=(state.bossDmg[wk]||0)+dealt; save();
  await flushCloud();
  const {error}=await SB.from('world_boss_hits').insert({week:wk,char_id:state.cid,user_id:ONLINE.user.id,name:state.name,cls:state.cls,level:state.level,dmg:dealt});
  if(error){ console.warn(error); toast(/relation|does not exist|schema cache|world_boss/i.test(error.message||'')?'A városi főgonoszhoz frissíteni kell az adatbázist (world_boss_hits tábla).':'A sebzést most nem sikerült elküldeni.'); }
  BB.at=0; loadBoss(); }
/* ---------- mailbox, friends and guild chat on the server: messages table ---------- */
const MB={items:[],sent:[],at:0,busy:false,gc:[],gcAt:0,gcCh:null,gcSig:'',seenIds:null};
function msgErr(error){ console.warn(error); toast(/relation|does not exist|schema cache|messages/i.test(error.message||'')?'Az üzenetekhez frissíteni kell az adatbázist (messages tábla).':'Nem sikerült elküldeni, próbáld újra.'); }
const mapMsg=r=>({id:r.id,at:Date.parse(r.created_at),kind:r.kind,k:r.kind,fromCid:r.from_char,fromKey:(r.from_user===ONLINE.user.id?'c-':'p-')+r.from_char,from:r.from_name,fromCls:r.from_cls,toCid:r.to_char,toKey:'p-'+r.to_char,to:r.to_name,body:r.body});
function updateMailBadge(){ const b=$('.mail-btn'); if(b) b.outerHTML=mailBtn(); }
async function loadMail(){ if(!SB||!ONLINE.user||!state||MB.busy) return; MB.busy=true;
  try{ const a=await SB.from('messages').select('*').eq('to_user',ONLINE.user.id).order('created_at',{ascending:false}).limit(100);
    const b=await SB.from('messages').select('*').eq('from_user',ONLINE.user.id).eq('kind','dm').order('created_at',{ascending:false}).limit(100);
    MB.at=now(); if(a.error) return;
    const before=MB.seenIds; MB.items=(a.data||[]).filter(r=>r.to_char===state.cid&&r.kind!=='guild').map(mapMsg); MB.sent=b.error?[]:(b.data||[]).filter(r=>r.from_char===state.cid).map(mapMsg);
    const ids=new Set(MB.items.map(m=>m.id)); if(before){ const fresh=MB.items.filter(m=>!before.has(m.id)); if(fresh.length&&!$('#mthread')) toast(fresh.length===1?`Új üzenet: ${fresh[0].from}`:`${fresh.length} új üzeneted jött.`); } MB.seenIds=ids;
    updateMailBadge(); refreshChat(); if(MAIL&&MAIL.tab!=='thread'&&$('.mail-card')) renderMail(); }
  finally{ MB.busy=false; } }
function mailItems(){ if(!MB.at||now()-MB.at>30000) setTimeout(loadMail,0);
  const out=MB.items.map(m=>({...m}));
  (state.arenaLog||[]).concat(ONLINE.logs||[]).forEach(l=>out.push({id:'a'+l.at,at:l.at,k:'arena',from:l.by,body:l.won?'megtámadott az arénában, de visszavertél.':'legyőzött az arénában.',won:l.won}));
  (GI.got||[]).filter(r=>r.to_char===state.cid&&r.status==='pending').forEach(r=>out.push({id:'g'+r.id,at:Date.parse(r.created_at),k:'invite',from:r.leader_name||'Valaki',body:`meghívott a(z) ${r.guild_name} céhbe. A Céh oldalon válaszolhatsz.`}));
  return out.sort((a,b)=>b.at-a.at); }
function threadWith(key){ const cid=key.replace(/^[cp]-/,''); return [...MB.items.filter(m=>m.kind==='dm'&&m.fromCid===cid),...MB.sent.filter(m=>m.toCid===cid)].sort((a,b)=>a.at-b.at); }
async function sendMsg(toKey,body,kind='dm'){ body=String(body||'').trim().slice(0,500); if(!body) return false; const cid=toKey.replace(/^[cp]-/,''), p=(ONLINE.all||[]).find(x=>x.id===cid); if(!p){ toast('Ez a játékos most nem érhető el.'); return false; }
  await flushCloud();
  const {error}=await SB.from('messages').insert({kind,from_char:state.cid,from_user:ONLINE.user.id,from_name:state.name,from_cls:state.cls,to_char:cid,to_user:p.user_id,to_name:p.name,body});
  if(error){ msgErr(error); return false; }
  if(kind==='dm') MB.sent.push({id:'tmp'+now(),at:now(),kind,toCid:cid,fromKey:'c-'+state.cid,from:state.name,body}); return true; }
function friendInfo(f){ const d=onlineChar(f.cid); return d?{...f,name:d.name,cls:d.cls,level:d.level}:f; }
function guildChat(){ const ch=guildChannel(); if(!ch) return []; if(MB.gcCh!==ch||now()-MB.gcAt>8000) setTimeout(()=>loadGuildChat(ch),0); return MB.gcCh===ch?MB.gc:[]; }
async function loadGuildChat(ch){ if(!ch||MB.gcBusy) return; MB.gcBusy=true;
  try{ const {data,error}=await SB.from('messages').select('*').eq('kind','guild').eq('channel',ch).order('created_at',{ascending:false}).limit(60); MB.gcAt=now(); if(error) return;
    MB.gcCh=ch; const sig=data.map(r=>r.id).join(); MB.gc=data.reverse().map(r=>({id:r.id,at:Date.parse(r.created_at),from:r.from_name,fromCls:r.from_cls,fromKey:(r.from_char===state.cid?'c-':'p-')+r.from_char,body:r.body}));
    if(sig!==MB.gcSig){ MB.gcSig=sig; refreshChat(); } }
  finally{ MB.gcBusy=false; } }
async function sendGuildMsg(body){ body=String(body||'').trim().slice(0,300); const ch=guildChannel(); if(!body||!ch) return false; await flushCloud();
  const {error}=await SB.from('messages').insert({kind:'guild',channel:ch,from_char:state.cid,from_user:ONLINE.user.id,from_name:state.name,from_cls:state.cls,body});
  if(error){ msgErr(error); return false; } MB.gcAt=0; await loadGuildChat(ch); return true; }
setInterval(()=>{ if(!state||!ONLINE.user) return; if($('#gchat')) loadGuildChat(guildChannel()); if($('#mthread')||now()-MB.at>30000) loadMail(); },8000);
/* ---------- guild raid on the server: guild_raid_hits table ---------- */
const RB={ch:null,rows:[],at:0,busy:false};
async function loadRaid(ch){ if(!SB||!ONLINE.user||!ch||RB.busy) return; RB.busy=true;
  try{ const {data,error}=await SB.from('guild_raid_hits').select('char_id,name,cls,dmg').eq('channel',ch).limit(20000); RB.at=now(); if(error){ console.warn(error); return; }
    const m={}; for(const h of data){ const r=m[h.char_id]||(m[h.char_id]={key:h.char_id,name:h.name,cls:h.cls,dmg:0}); r.dmg+=h.dmg; r.name=h.name; }
    const sig=JSON.stringify(m); RB.ch=ch; const changed=sig!==RB.sig; RB.sig=sig; RB.rows=Object.values(m);
    if(changed&&view==='ceh'&&!battle&&!document.activeElement?.matches('input,textarea')) render(); }
  finally{ RB.busy=false; } }
function raidRows(){ const ch=guildChannel(); if(!ch) return []; if(RB.ch!==ch||now()-RB.at>20000) setTimeout(()=>loadRaid(ch),0);
  const rows=(RB.ch===ch?RB.rows:[]).map(r=>({...r,me:r.key===state.cid})), mine=(state.raidLocal||{})[ch]||0, me=rows.find(r=>r.me);
  if(me) me.dmg=Math.max(me.dmg,mine); else if(mine) rows.push({key:state.cid,name:state.name,cls:state.cls,dmg:mine,me:true});
  const L=raidLeader(), bots=L&&L.guild&&L.guild.raid&&L.guild.raid.bots; if(bots) rows.push({key:'bots',name:'Gépi céhtagok',cls:'kidobo',dmg:bots,bots:true});
  return rows; }
async function recordRaidHit(dealt){ const ch=guildChannel(); if(!ch) return; state.raidLocal=state.raidLocal||{}; state.raidLocal[ch]=(state.raidLocal[ch]||0)+dealt; save();
  await flushCloud();
  const {error}=await SB.from('guild_raid_hits').insert({channel:ch,char_id:state.cid,user_id:ONLINE.user.id,name:state.name,cls:state.cls,dmg:dealt});
  if(error){ console.warn(error); toast(/relation|does not exist|schema cache|guild_raid/i.test(error.message||'')?'A céhes főgonoszhoz frissíteni kell az adatbázist (guild_raid_hits tábla).':'A sebzést most nem sikerült elküldeni.'); }
  RB.at=0; loadRaid(ch); }
function renderNoConfig(){
  return `<div class="create wrap">${banner('skyline')}<div class="logo">Éjjeli<br><span>Járat</span></div>
    <section class="card stack"><h3>A szerver még nincs beállítva</h3><p class="muted" style="margin:0">Töltsd ki a <b>config.js</b> fájlban a Supabase projekt címét és az anon kulcsot, aztán töltsd újra az oldalt.</p></section></div>`;
}
function renderAuth(){
  const su=ONLINE.mode==='signup';
  return `<div class="create wrap">${banner('skyline')}<div class="logo">Éjjeli<br><span>Járat</span></div>
    <p class="tag">Éjfél után a városban más lakik a lépcsőházakban. Lépj be, és a hőseid minden eszközödön veled lesznek.</p>
    <form class="card stack" id="authf" onsubmit="event.preventDefault();doAuth()">
      <span class="label">${ic('user')}${su?'Regisztráció':'Belépés'}</span>
      <div class="field"><label class="label" for="em">E-mail</label><input id="em" name="email" type="email" autocomplete="${su?'email':'username'}" value="${esc(rememberedEmail())}" required></div>
      <div class="field"><label class="label" for="pw">Jelszó</label><input id="pw" name="password" type="password" autocomplete="${su?'new-password':'current-password'}" minlength="6" required></div>
      <label class="remember"><input type="checkbox" id="rem" ${rememberOn()?'checked':''}> Emlékezz rám ezen az eszközön</label>
      ${ONLINE.err?`<p class="auth-err">${esc(ONLINE.err)}</p>`:''}
      <button class="btn primary" type="submit" ${ONLINE.busy?'disabled':''}>${ONLINE.busy?'Pillanat…':su?'Fiók létrehozása':'Belépés'}</button>
      <button class="btn small" type="button" data-act="authmode">${su?'Van már fiókom, belépek':'Még nincs fiókom, regisztrálok'}</button>
    </form>${installCard()}</div>`;
}
function rememberOn(){ try{ return localStorage.getItem('ej-remember')!=='0'; }catch(e){ return true; } }
function rememberedEmail(){ try{ return rememberOn()?(localStorage.getItem('ej-email')||''):''; }catch(e){ return ''; } }
async function doAuth(){
  const rem=$('#rem')?$('#rem').checked:true;
  try{ localStorage.setItem('ej-remember',rem?'1':'0'); if(rem) localStorage.setItem('ej-email',($('#em')?.value||'').trim()); else localStorage.removeItem('ej-email'); }catch(e){}
  const em=($('#em')?.value||'').trim(), pw=$('#pw')?.value||''; if(!em||pw.length<6){ ONLINE.err='Adj meg egy e-mail-címet és legalább 6 karakteres jelszót.'; render(); return; }
  ONLINE.busy=true; ONLINE.err=''; render(); $('#em').value=em; $('#pw').value=pw; if($('#rem')) $('#rem').checked=rem;
  try{
    const r= ONLINE.mode==='signup' ? await SB.auth.signUp({email:em,password:pw}) : await SB.auth.signInWithPassword({email:em,password:pw});
    if(r.error) throw r.error;
    if(!r.data.session){ ONLINE.mode='login'; ONLINE.err='Kész! Nézd meg az e-mailed, erősítsd meg a címed, aztán lépj be.'; ONLINE.busy=false; render(); return; }
    ONLINE.user=r.data.session.user; ONLINE.busy=false; await afterLogin();
  }catch(e){ ONLINE.busy=false; const m=String(e.message||e); ONLINE.err=/Invalid login/i.test(m)?'Hibás e-mail vagy jelszó.':/already registered/i.test(m)?'Ezzel a címmel már van fiók. Lépj be.':m; render(); }
}
async function afterLogin(){
  try{ await pullRoster(); }catch(e){ toast('Nem sikerült betölteni a hőseidet. Próbáld újra.'); }
  const st=load(); state=st?migrate(st):null;
  if(state){ if(!(state.arena[0]&&state.arena[0].rank)) state.arena=genArena(); syncLadder(); view='terkep'; loadOnlineLogs(true); }
  render(); window.scrollTo(0,0);
}
async function boot(){
  setInterval(()=>tick(false),250);
  if(!SB){ render(); return; }
  SB.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ ONLINE.user=null; ONLINE.mode='login'; ONLINE.err=''; state=null; ONLINE.players=[]; ONLINE.logs=[]; render(); } });
  const {data:{session}}=await SB.auth.getSession();
  if(session){ ONLINE.user=session.user; await afterLogin(); } else render();
}
/* ================= loop ================= */
function tick(force){
  if(!state) return;
  const t=now();
  // coffee does not trickle back; the pot is refilled once a day at midnight
  if(state.energyDay!==todayKey()){ state.energyDay=todayKey(); state.energy=ENERGY_MAX; save(); }
  // Feri restocks the shop at midnight
  if(state.shopDay!==todayKey()){ const had=!!state.shopDay; state.shopDay=todayKey(); if(had){ state.shop=genShop(); if(view==='bolt'&&!battle&&!force){ render(); toast('Feri éjfélkor kipakolt egy új adagot.'); } } save(); }
  const en=$('#en'); if(en) en.textContent=state.energy;
  const ready = state.active ? state.active.endsAt<=t : null;
  if(!force && ready!==lastReady && !battle){ if(ready===true&&lastReady===false) sfx('arrive'); lastReady=ready; render(); return; }
  lastReady=ready;
  if(state.active && !ready){ const left=state.active.endsAt-t, qt=$('#qtime'), qp=$('#qprog'); if(qt) qt.textContent=fmtTime(left); if(qp) qp.style.width=(1-left/((state.active.dur||state.active.q.dur)*1000))*100+'%'; const qm=$('#qme'); if(qm) qm.style.left=journeyPct()+'%'; }
  const aLeft=Math.max(0,state.arenaReadyAt-t), aReady=aLeft===0;
  const acd=$('#acd'); if(acd) acd.textContent=aLeft?fmtTime(aLeft):'Most';
  if(view==='terkep'){ const mq=$('#m-q'), ma=$('#m-a'), md=$('#m-d');
    if(mq&&state.active) mq.textContent=fmtTime(Math.max(0,state.active.endsAt-t)); if(ma) ma.textContent=fmtTime(aLeft);
    if(md) md.textContent=fmtTime(Math.max(0,(state.dungeonReadyAt||0)-t));
    const sig=[!!(state.active&&state.active.endsAt<=t), aLeft===0, (state.dungeonReadyAt||0)<=t].join();
    if(!force && !battle && mapSig!==null && sig!==mapSig){ mapSig=sig; render(); return; } mapSig=sig; }
  if(!force && view==='arena' && aReady!==lastArenaReady && !battle){ lastArenaReady=aReady; render(); return; }
  lastArenaReady=aReady;
  const dLeft=Math.max(0,(state.dungeonReadyAt||0)-t), dReady=dLeft===0, dcd=$('#dcd');
  if(dcd) dcd.textContent=dLeft?fmtTime(dLeft):'Most';
  if(!force && view==='kazamata' && dReady!==lastDungReady && !battle){ lastDungReady=dReady; render(); return; }
  lastDungReady=dReady;
  const gLeft=state.guild?Math.max(0,state.guild.readyAt-t):0, gReady=gLeft===0, gcd=$('#gcd');
  if(gcd) gcd.textContent=gLeft?fmtTime(gLeft):'Most';
  if(!force && view==='ceh' && guildTab==='harc' && gReady!==lastGuildReady && !battle){ lastGuildReady=gReady; render(); return; }
  lastGuildReady=gReady;
  if(view==='kocsma' && !state.active) document.querySelectorAll('.quest-go').forEach(b=>{ const c=+b.dataset.cost; if(b.disabled!==(state.energy<c)){ b.disabled=state.energy<c; render(); } });
}
let toastT;
function toast(msg){ document.querySelector('.toast')?.remove(); const d=document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); clearTimeout(toastT); toastT=setTimeout(()=>d.remove(),2600); }
boot();
</script>
