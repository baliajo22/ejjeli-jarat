  if(!lc) return; if(lc===guildChannel()){ INSPECT=null; $('#overlay-root').innerHTML=''; view='ceh'; guildTab='tagok'; render(); window.scrollTo(0,0); return; }
  const L=lc===state.cid?state:realData(lc), g=L&&L.guild; if(!g){ toast('Ennek a céhnek az adatai most nem érhetők el.'); return; }
  const lad=L.guildLadder||[], rank=lad.findIndex(e=>e.me)+1;
  const row=(n,cls,l,role)=>`<div class="opp">${portrait(CLASS_ART[cls]||CLASS_ART.kidobo)}<div><div class="item-name">${esc(n)} <span class="role-tag ${role==='Vezető'?'lead':role==='Játékos'?'real':''}">${role}</span></div><div class="item-stats"><span>${l}. szint · ${CLASSES[cls]?CLASSES[cls].name:''}</span></div></div></div>`;
  $('#overlay-root').innerHTML=`<div class="overlay" data-act="closemg"><div class="mg-card gv-card" data-act="noop" role="dialog" aria-label="${esc(g.name)}"><button class="ins-x" data-act="closemg" aria-label="Bezárás">×</button>
    <span class="label">${ic('fame')}Céh</span>${gHead(g,{view:true,rank,ladLen:lad.length,treasury:g.treasury})}
    <section class="card"><div class="row between" style="margin-bottom:4px"><span class="label">${ic('user')}Tagok</span><span class="note mono">${g.members.length+1} fő</span></div>${row(L.name,L.cls,L.level,'Vezető')}${g.members.map(m=>row(m.name,m.cls,m.real?((realData(m.cid)||{}).level||m.lvl||1):memberLevel(m),m.real?'Játékos':'Tag')).join('')}</section>
  </div></div>`; }
function gDescHtml(g,lead){
  if(lead&&GDESC_EDIT) return `<div class="g-desc edit"><textarea id="gdesc" maxlength="300" rows="3" placeholder="pl. Napi 3 küldetés kötelező. Kincstár +15% pénz, Edzőterem +12% XP. Aktív, magyar céh.">${esc(g.desc||'')}</textarea><div class="row between"><span class="note">Ezt látják azok is, akiket meghívsz.</span><span class="row" style="gap:6px"><button class="btn small" data-act="gdesccancel">Mégse</button><button class="btn small primary" data-act="gdescsave">Mentés</button></span></div></div>`;
  return `<div class="g-desc">${g.desc?`<p>${esc(g.desc)}</p>`:`<p class="muted">${lead?'Még nincs leírás. Írd ide, milyen a céhetek, és mit kaptok a fejlesztésekből.':'A vezető még nem írt leírást.'}</p>`}${lead?`<button class="btn small" data-act="gdescedit">${ic('chat')}${g.desc?'Szerkesztés':'Leírás írása'}</button>`:''}</div>`; }
function gHead(g,o){ return `<section class="card g-head-wrap"><div class="g-head"><div class="g-emb">${svg(emblemSvg(g.emblem))}</div><div class="g-info"><div class="label">Céhszint ${1+Object.values(g.upg).reduce((a,b)=>a+b,0)}${o.member?' · tag vagy':''}</div><h3>${esc(g.name)}</h3><div class="g-stats">${o.rank?`<span class="with-ic">${ic('trophy','ic-fame')}#${o.rank} / ${o.ladLen}</span>`:''}<span class="with-ic">${ic('user')}${g.members.length+1}${o.cap?'/'+o.cap:''} fő</span><span class="with-ic">${ic('fame','ic-fame')}${g.honor} becsület</span><span class="with-ic">${ic('coin','ic-gold')}${fmt(o.treasury)} Ft${g.pog?` · ${g.pog} pogácsa`:''} kassza</span></div></div></div>
  <div class="g-bonus">${GUILD_UPG.filter(u=>g.upg[u.id]).map(u=>`<span class="chip">${ic(u.icon)}${u.fx(g.upg[u.id])}</span>`).join('')}${o.view||!raidKills()?'':`<span class="chip raid-chip">${ic('fame')}rajtaütés: +${raidKills()}% Ft és XP</span>`}${!GUILD_UPG.some(u=>g.upg[u.id])&&(o.view||!raidKills())?'<span class="note">Még nincs fejlesztés.</span>':''}</div>${gDescHtml(g,!o.member&&!o.view)}</section>`; }
const G_TABS=[['tagok','Tagok','user'],['fejlesztes','Fejlesztés','refresh'],['harc','Harc','fight'],['chat','Chat','chat']];
function raidReady(){ if(!state||!guildChannel()) return false; return raidDay().used<RAID_FREE||raidClaimable()>0; }
const gTabs=()=>`<div class="seg seg4" role="tablist">${G_TABS.map(([k,l,i])=>`<button role="tab" data-act="gtab" data-t="${k}" aria-selected="${guildTab===k}" style="position:relative">${ic(i)}${l}${k==='harc'&&raidReady()?'<span class="mg-dot"></span>':''}</button>`).join('')}</div>`;
function renderCeh(){
  const g=state.guild;
  let html=`${banner('ceh')}<section class="scene"><span class="label">${ic('pin')}Panelház pincéje · klubhelyiség</span><h2>${g?esc(g.name):state.memberOf?esc(state.memberOf.name):'Egyedül nem megy'}</h2><p>${g?'Közös kassza, közös fejlesztések és közös harc a város többi céhe ellen.':state.memberOf?'Tag vagy. A vezető fejlesztései neked is szólnak, és a céhharcban te is ott vagy.':'Alapíts céhet, hívj be más hősöket, fejlesszétek együtt a klubhelyiséget, és harcoljatok a város többi céhe ellen.'}</p></section>`;
  if(state.level<GUILD_UNLOCK) return html+`<section class="card lock-card">${ic('lock')}<div><h3>A ${GUILD_UNLOCK}. szinten nyílik meg</h3><p class="muted">Még ${GUILD_UNLOCK-state.level} szintet kell lépned. Addig gyűjts forintot az alapításra (${GUILD_COST} Ft).</p></div></section>`;
  if(!g&&state.memberOf) return html+renderMemberGuild();
  if(!g) return html+invitesCard()+renderGuildCreate();
  const rank=state.guildLadder.findIndex(e=>e.me)+1;
  html+=gHead(g,{rank,ladLen:state.guildLadder.length,cap:guildCap(),treasury:g.treasury+pendingDonations('ft')});
  html+=gTabs();
  return html+(guildTab==='tagok'?renderGuildMembers():guildTab==='fejlesztes'?renderGuildUpg():guildTab==='chat'?chatBox():renderGuildWar());
}
function renderGuildCreate(){
  const can=state.gold>=GUILD_COST;
  return `<section class="card stack"><span class="label">${ic('fame')}Céh alapítása</span>
   <div class="field"><label class="label" for="gname">A céh neve</label><input id="gname" maxlength="26" placeholder="pl. Éjféli Holdfarkasok" autocomplete="off"></div>
   <div class="field"><span class="label">Címer</span><div class="emb-pick">${Object.keys(EMBLEMS).map(e=>`<button class="emb" data-act="pickemb" data-e="${e}" aria-pressed="${e===pickedEmblem}">${svg(emblemSvg(e))}</button>`).join('')}</div></div>
   <button class="btn primary" data-act="foundguild" ${can?'':'disabled'}>${ic('fame')}Céh alapítása · ${GUILD_COST} Ft</button>
   ${can?'':`<p class="note">Még ${GUILD_COST-state.gold} Ft hiányzik.</p>`}</section>`;
}
function memberRow(m,lvl,me){ return `<div class="opp">${portrait(CLASS_ART[m.cls])}<div><div class="item-name">${esc(m.name)} <span class="role-tag ${me?'lead':m.real?'real':''}">${me?'Vezető':m.real?'Játékos':'Tag'}</span></div><div class="item-stats"><span>${lvl}. szint · ${CLASSES[m.cls].name}</span></div></div>${me?'':`<button class="btn small" data-act="gkick" data-id="${m.id}">Kirúg</button>`}</div>`; }
function realInviteCard(full){
  const C=realCandidates();
  let h=`<section class="card"><div class="row between" style="margin-bottom:4px"><span class="label">${ic('user')}Valódi játékosok</span><span class="note">Ők maguk döntenek</span></div>`;
  if(!C.length) h+=`<p class="muted" style="margin:6px 0 0">${REAL_INV_EMPTY}</p>`;
  for(const c of C) h+=`<div class="opp">${portrait(CLASS_ART[c.cls]||CLASS_ART.kidobo).replace('<div','<div data-act="inspect" data-id="'+(c.key||'c-'+c.cid)+'"')}<div><div class="item-name">${esc(c.name)}</div><div class="item-stats"><span>${c.level}. szint · ${CLASSES[c.cls]?CLASSES[c.cls].name:''}</span></div></div>${c.status==='pending'?`<button class="btn small" disabled>Meghívva</button>`:`<button class="btn small primary" data-act="ginvreal" data-id="${c.cid}" ${full?'disabled':''}>Meghív</button>`}</div>`;
  return h+`</section>`;
}
const REAL_INV_EMPTY='Most nincs meghívható játékos. Csak legalább 10. szintű, céh nélküli játékosokat hívhatsz meg.';
function renderGuildMembers(){
  const g=state.guild, full=g.members.length+1>=guildCap();
  let html=`<section class="card"><div class="row between" style="margin-bottom:4px"><span class="label">${ic('user')}Tagok</span><span class="note mono">${g.members.length+1}/${guildCap()}</span></div>${memberRow({name:state.name,cls:state.cls},state.level,true)}${g.members.map(m=>memberRow(m,memberLevel(m),false)).join('')}</section>
  ${realInviteCard(full)}
  <section class="card"><div class="row between" style="margin-bottom:4px"><span class="label">${ic('user')}Meghívható hősök</span><button class="btn small" data-act="gcand">${ic('refresh')}Új jelöltek</button></div>${full?`<p class="note">Megtelt a céh. A Klubhelyiség fejlesztésével bővítheted.</p>`:''}`;
  for(const c of g.candidates) html+=`<div class="opp">${portrait(CLASS_ART[c.cls])}<div><div class="item-name">${esc(c.name)}</div><div class="item-stats"><span>${memberLevel(c)}. szint · ${CLASSES[c.cls].name}</span></div></div><button class="btn small primary" data-act="ginvite" data-id="${c.id}" ${full?'disabled':''}>Meghív</button></div>`;
  if(!g.candidates.length) html+=`<p class="muted">Nincs több jelölt. Kérj újakat.</p>`;
  return html+`</section><p class="note">Nem mindenki fogadja el a meghívást. A tagjaid minden sikeres küldetésed után beadnak a közös kasszába, és veled harcolnak a céhharcban.</p>`;
}
function renderGuildUpg(g=state.guild,ro=false){
  const act=ro?'gdonatem':'gdonate', ft=g.treasury+pendingDonations('ft'), pg=(g.pog||0)+pendingDonations('pog');
  let html=`<section class="card"><div class="label">${ic('coin')}Közös kassza</div><div class="kassza"><span class="mono">${fmt(ft)} Ft</span><span class="mono">${pg} ${pogIc()}</span></div>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px">${[50,200,1000].map(a=>`<button class="btn small" data-act="${act}" data-a="${a}" ${state.gold<a?'disabled':''}>+${fmt(a)} Ft</button>`).join('')}${[1,5].map(a=>`<button class="btn small pog-btn" data-act="${act}" data-cur="pog" data-a="${a}" ${(state.pog||0)<a?'disabled':''}>+${a} ${pogIc()}</button>`).join('')}</div>
    <p class="note" style="margin:6px 0 0">Forintot és pogácsát is befizethet bárki a céhből. A fejlesztések a kasszából fizetődnek, a 10. szinttől pogácsa is kell hozzájuk. A fejlesztések a céh minden tagjának szólnak.</p>${contribList(g)}</section><section class="card">`;
  for(const u of GUILD_UPG){
    const l=g.upg[u.id]||0, c=upgCost(l), pg=upgPog(l), price=`${fmt(c)} Ft${pg?` + ${pg} ${pogIc()}`:''}`, tens=l%10;
    html+=`<div class="upg"><div class="stat-ic">${ic(u.icon)}</div><div><div class="item-name">${u.name} <span class="mono muted" style="font-weight:500">${l}. szint</span></div><div class="pips small">${Array.from({length:10},(_,i)=>`<i class="${i<tens||(l>0&&tens===0)?'done':''}"></i>`).join('')}</div><div class="note">${u.desc}</div><div class="eff"><span class="vals"><b>${u.fx(l)}</b><span class="eff-next">→ ${u.fx(l+1)}</span></span></div></div>${ro?`<span class="chip">${price}</span>`:`<button class="btn small primary upg-btn" data-act="gupg" data-id="${u.id}" ${g.treasury<c||(g.pog||0)<pg?'disabled':''}>${price}</button>`}</div>`;
  }
  return html+`</section>${ro?'<p class="note">Fejleszteni csak a vezető tud. Te a kasszába fizetéssel segíthetsz, a fejlesztések neked is szólnak.</p>':''}`;
}
const REAL_GUILD_EMPTY='Még nincs másik játékos által vezetett céh. Ha valaki alapít egyet, itt megjelenik, és megtámadhatjátok.';
function renderGuildWar(){
  const g=state.guild, left=Math.max(0,g.readyAt-now()), L=state.guildLadder, myI=L.findIndex(e=>e.me), tg=[];
  const raid=raidCard();
  for(let j=Math.max(0,myI-3);j<myI;j++) tg.push(j);
  if(!tg.length) for(let j=myI+1;j<Math.min(L.length,myI+3);j++) tg.push(j);
  let html=raid+`<section class="card row between"><span class="label">${ic('clock')}Következő céhharc</span><span class="mono" id="gcd" style="font-size:16px">${left?fmtTime(left):'Most'}</span></section>
  <section class="card"><div class="row between" style="margin-bottom:4px"><span class="label">${ic('fight')}Megtámadható céhek</span><span class="note">Győzelemmel átveszitek a helyüket</span></div>`;
  for(const j of tg){ const e=L[j];
    html+=`<div class="opp"><div class="port g-mini">${svg(emblemSvg(e.emblem))}</div><div><div class="item-name"><span class="rank-tag">#${j+1}</span> ${esc(e.name)}</div><div class="item-stats"><span>${e.size} tag · kb. ${Math.max(1,state.level+e.off)}. szint</span><span>ti: ${g.members.length+1} fő</span></div></div>
      ${left?`<button class="btn small pog-btn" data-act="gwar" data-pog="1" data-id="${e.id}" ${(state.pog||0)<1?'disabled':''}>${pogIc()}1 · Most</button>`:`<button class="btn small primary" data-act="gwar" data-id="${e.id}">${ic('fight')}Támadás</button>`}</div>`; }
  const RG=realGuilds();
  html+=`</section><section class="card"><div class="row between" style="margin-bottom:4px"><span class="label">${ic('user')}Játékosok céhei</span><span class="note">${RG.length?'Valódi játékosok, becsület szerint':''}</span></div>`;
  html+=RG.length?RG.slice(0,15).map((e,i)=>`<div class="opp"><div class="port g-mini" data-act="viewguild" data-id="${e.lc}">${svg(emblemSvg(e.emblem))}</div><div data-act="viewguild" data-id="${e.lc}" class="insp"><div class="item-name"><span class="rank-tag">#${i+1}</span> ${esc(e.name)}</div><div class="item-stats"><span>${e.size} tag · vezető: ${esc(e.leader)} (${e.lvl}.)</span><span class="with-ic">${ic('fame','ic-fame')}${e.honor}</span></div></div>
      ${left?`<button class="btn small pog-btn" data-act="gwar" data-pog="1" data-id="${e.id}" ${(state.pog||0)<1?'disabled':''}>${pogIc()}1 · Most</button>`:`<button class="btn small primary" data-act="gwar" data-id="${e.id}">${ic('fight')}Támadás</button>`}</div>`).join('')
    :`<p class="muted" style="margin:6px 0 0">${REAL_GUILD_EMPTY}</p>`;
  html+=`</section><p class="note">Váltóharc: a gyengébbek kezdenek, a győztes a megmaradt életével küzd tovább a következő ellenféllel, amíg el nem esik. Az a céh nyer, amelyiknek utoljára marad talpon harcosa.</p>
  <section class="card"><div class="row between" style="margin-bottom:8px"><span class="label">${ic('trophy')}Céhek ranglétrája</span><span class="note">${L.length} céh a városban</span></div><div class="ladder">${guildLadderRows(myI)}</div></section>`;
  return html;
}
function guildLadderRows(myI,L=state.guildLadder,G=state.guild){
  const show=new Set([0,1,2]); for(let i=Math.max(0,myI-3);i<=Math.min(L.length-1,myI+2);i++) show.add(i);
  let out='', prev=-1;
  [...show].sort((a,b)=>a-b).forEach(i=>{ if(i>prev+1) out+=`<div class="lad-gap">···</div>`; prev=i;
    const e=L[i], me=!!e.me, g=G;
    out+=`<div class="lad-row ${me?'me':''}"><span class="lad-rank r${i<3?i+1:0}">${i+1}</span><div class="port lad-port g-mini">${svg(emblemSvg(me?g.emblem:e.emblem))}</div><span class="lad-name">${esc(me?g.name:e.name)}${me?' <em>ti</em>':''}</span><span class="lad-lvl mono">${me?g.members.length+1:e.size} fő</span></div>`; });
  return out;
}

function mapSvg(){
  const r=seeded(77); let st=''; for(let i=0;i<40;i++) st+=`<circle cx="${(r()*360).toFixed(0)}" cy="${(r()*480).toFixed(0)}" r="${r()<.15?1.2:.7}" fill="${WH}" opacity="${(.15+r()*.35).toFixed(2)}" stroke="none"/>`;
  let trees=''; [[40,120],[60,300],[28,420],[300,400],[332,130],[250,250],[200,440],[120,190]].forEach(([x,y])=>{ trees+=`<circle cx="${x}" cy="${y}" r="9" fill="#2c4a3a" stroke="#10111b" stroke-width="1.5"/><circle cx="${x-3}" cy="${y-3}" r="3" fill="#3d6a50" stroke="none"/>`; });

    }
  }
}

function endDrag(e,cancel){

async function loadRaid(ch){ if(!SB||!ONLINE.user||!ch||RB.busy) return; RB.busy=true;
  try{ const {data,error}=await SB.from('guild_raid_hits').select('char_id,name,cls,dmg').eq('channel',ch).limit(20000); RB.at=now(); if(error){ console.warn(error); return; }
    const m={}; for(const h of data){ const r=m[h.char_id]||(m[h.char_id]={key:h.char_id,name:h.name,cls:h.cls,dmg:0}); r.dmg+=h.dmg; r.name=h.name; }
    const sig=JSON.stringify(m); RB.ch=ch; const changed=sig!==RB.sig; RB.sig=sig; RB.rows=Object.values(m);
    if(changed&&view==='ceh'&&!battle&&!document.activeElement?.matches('input,textarea')) render(); }
  finally{ RB.busy=false; } }
function raidRows(){ const ch=guildChannel(); if(!ch) return []; if(RB.ch!==ch||now()-RB.at>20000) setTimeout(()=>loadRaid(ch),0);
  const rows=(RB.ch===ch?RB.rows:[]).map(r=>({...r,me:r.key===state.cid})), mine=(state.raidLocal||{})[ch]||0, me=rows.find(r=>r.me);
  if(me) me.dmg=Math.max(me.dmg,mine); else if(mine) rows.push({key:state.cid,name:state.name,cls:state.cls,dmg:mine,me:true});
  const L=raidLeader(), bots=L&&L.guild&&L.guild.raid&&L.guild.raid.bots; if(bots) rows.push({key:'bots',name:'Gépi céhtagok',cls:'kidobo',dmg:bots,bots:true});
  return rows; }
async function recordRaidHit(dealt){ const ch=guildChannel(); if(!ch) return; state.raidLocal=state.raidLocal||{}; state.raidLocal[ch]=(state.raidLocal[ch]||0)+dealt; save();
  await flushCloud();
  const {error}=await SB.from('guild_raid_hits').insert({channel:ch,char_id:state.cid,user_id:ONLINE.user.id,name:state.name,cls:state.cls,dmg:dealt});
  if(error){ console.warn(error); toast(/relation|does not exist|schema cache|guild_raid/i.test(error.message||'')?'A céhes főgonoszhoz frissíteni kell az adatbázist (guild_raid_hits tábla).':'A sebzést most nem sikerült elküldeni.'); }
  RB.at=0; loadRaid(ch); }
function renderNoConfig(){
  return `<div class="create wrap">${banner('skyline')}<div class="logo">Éjjeli<br><span>Járat</span></div>
    <section class="card stack"><h3>A szerver még nincs beállítva</h3><p class="muted" style="margin:0">Töltsd ki a <b>config.js</b> fájlban a Supabase projekt címét és az anon kulcsot, aztán töltsd újra az oldalt.</p></section></div>`;
}
function renderAuth(){
  const su=ONLINE.mode==='signup';
  return `<div class="create wrap">${banner('skyline')}<div class="logo">Éjjeli<br><span>Járat</span></div>
    <p class="tag">Éjfél után a városban más lakik a lépcsőházakban. Lépj be, és a hőseid minden eszközödön veled lesznek.</p>
    <form class="card stack" id="authf" onsubmit="event.preventDefault();doAuth()">
      <span class="label">${ic('user')}${su?'Regisztráció':'Belépés'}</span>
      <div class="field"><label class="label" for="em">E-mail</label><input id="em" name="email" type="email" autocomplete="${su?'email':'username'}" value="${esc(rememberedEmail())}" required></div>
      <div class="field"><label class="label" for="pw">Jelszó</label><input id="pw" name="password" type="password" autocomplete="${su?'new-password':'current-password'}" minlength="6" required></div>
      <label class="remember"><input type="checkbox" id="rem" ${rememberOn()?'checked':''}> Emlékezz rám ezen az eszközön</label>
      ${ONLINE.err?`<p class="auth-err">${esc(ONLINE.err)}</p>`:''}
      <button class="btn primary" type="submit" ${ONLINE.busy?'disabled':''}>${ONLINE.busy?'Pillanat…':su?'Fiók létrehozása':'Belépés'}</button>
      <button class="btn small" type="button" data-act="authmode">${su?'Van már fiókom, belépek':'Még nincs fiókom, regisztrálok'}</button>
    </form>${installCard()}</div>`;
}
function rememberOn(){ try{ return localStorage.getItem('ej-remember')!=='0'; }catch(e){ return true; } }
function rememberedEmail(){ try{ return rememberOn()?(localStorage.getItem('ej-email')||''):''; }catch(e){ return ''; } }
async function doAuth(){
  const rem=$('#rem')?$('#rem').checked:true;
  try{ localStorage.setItem('ej-remember',rem?'1':'0'); if(rem) localStorage.setItem('ej-email',($('#em')?.value||'').trim()); else localStorage.removeItem('ej-email'); }catch(e){}
  const em=($('#em')?.value||'').trim(), pw=$('#pw')?.value||''; if(!em||pw.length<6){ ONLINE.err='Adj meg egy e-mail-címet és legalább 6 karakteres jelszót.'; render(); return; }
  ONLINE.busy=true; ONLINE.err=''; render(); $('#em').value=em; $('#pw').value=pw; if($('#rem')) $('#rem').checked=rem;
  try{
    const r= ONLINE.mode==='signup' ? await SB.auth.signUp({email:em,password:pw}) : await SB.auth.signInWithPassword({email:em,password:pw});
    if(r.error) throw r.error;
    if(!r.data.session){ ONLINE.mode='login'; ONLINE.err='Kész! Nézd meg az e-mailed, erősítsd meg a címed, aztán lépj be.'; ONLINE.busy=false; render(); return; }
    ONLINE.user=r.data.session.user; ONLINE.busy=false; await afterLogin();
  }catch(e){ ONLINE.busy=false; const m=String(e.message||e); ONLINE.err=/Invalid login/i.test(m)?'Hibás e-mail vagy jelszó.':/already registered/i.test(m)?'Ezzel a címmel már van fiók. Lépj be.':m; render(); }
}
async function afterLogin(){
  try{ await pullRoster(); }catch(e){ toast('Nem sikerült betölteni a hőseidet. Próbáld újra.'); }
  const st=load(); state=st?migrate(st):null;
  if(state){ if(!(state.arena[0]&&state.arena[0].rank)) state.arena=genArena(); syncLadder(); view='terkep'; loadOnlineLogs(true); }
  render(); window.scrollTo(0,0);
}
async function boot(){
  setInterval(()=>tick(false),250);
  if(!SB){ render(); return; }
  SB.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ ONLINE.user=null; ONLINE.mode='login'; ONLINE.err=''; state=null; ONLINE.players=[]; ONLINE.logs=[]; render(); } });
  const {data:{session}}=await SB.auth.getSession();
  if(session){ ONLINE.user=session.user; await afterLogin(); } else render();
}
/* ================= loop ================= */
function tick(force){
  if(!state) return;
  const t=now();
  // coffee does not trickle back; the pot is refilled once a day at midnight
  if(state.energyDay!==todayKey()){ state.energyDay=todayKey(); state.energy=ENERGY_MAX; save(); }
  // Feri restocks the shop at midnight
  if(state.shopDay!==todayKey()){ const had=!!state.shopDay; state.shopDay=todayKey(); if(had){ state.shop=genShop(); if(view==='bolt'&&!battle&&!force){ render(); toast('Feri éjfélkor kipakolt egy új adagot.'); } } save(); }
  const en=$('#en'); if(en) en.textContent=state.energy;
  const ready = state.active ? state.active.endsAt<=t : null;
  if(!force && ready!==lastReady && !battle){ if(ready===true&&lastReady===false) sfx('arrive'); lastReady=ready; render(); return; }
  lastReady=ready;
  if(state.active && !ready){ const left=state.active.endsAt-t, qt=$('#qtime'), qp=$('#qprog'); if(qt) qt.textContent=fmtTime(left); if(qp) qp.style.width=(1-left/((state.active.dur||state.active.q.dur)*1000))*100+'%'; const qm=$('#qme'); if(qm) qm.style.left=journeyPct()+'%'; }
  const aLeft=Math.max(0,state.arenaReadyAt-t), aReady=aLeft===0;
  const acd=$('#acd'); if(acd) acd.textContent=aLeft?fmtTime(aLeft):'Most';
  if(view==='terkep'){ const mq=$('#m-q'), ma=$('#m-a'), md=$('#m-d');
    if(mq&&state.active) mq.textContent=fmtTime(Math.max(0,state.active.endsAt-t)); if(ma) ma.textContent=fmtTime(aLeft);
    if(md) md.textContent=fmtTime(Math.max(0,(state.dungeonReadyAt||0)-t));
    const sig=[!!(state.active&&state.active.endsAt<=t), aLeft===0, (state.dungeonReadyAt||0)<=t].join();
    if(!force && !battle && mapSig!==null && sig!==mapSig){ mapSig=sig; render(); return; } mapSig=sig; }
  if(!force && view==='arena' && aReady!==lastArenaReady && !battle){ lastArenaReady=aReady; render(); return; }
  lastArenaReady=aReady;
  const dLeft=Math.max(0,(state.dungeonReadyAt||0)-t), dReady=dLeft===0, dcd=$('#dcd');
  if(dcd) dcd.textContent=dLeft?fmtTime(dLeft):'Most';
  if(!force && view==='kazamata' && dReady!==lastDungReady && !battle){ lastDungReady=dReady; render(); return; }
  lastDungReady=dReady;
  const gLeft=state.guild?Math.max(0,state.guild.readyAt-t):0, gReady=gLeft===0, gcd=$('#gcd');
  if(gcd) gcd.textContent=gLeft?fmtTime(gLeft):'Most';
  if(!force && view==='ceh' && guildTab==='harc' && gReady!==lastGuildReady && !battle){ lastGuildReady=gReady; render(); return; }
  lastGuildReady=gReady;
  if(view==='kocsma' && !state.active) document.querySelectorAll('.quest-go').forEach(b=>{ const c=+b.dataset.cost; if(b.disabled!==(state.energy<c)){ b.disabled=state.energy<c; render(); } });
}
let toastT;
function toast(msg){ document.querySelector('.toast')?.remove(); const d=document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); clearTimeout(toastT); toastT=setTimeout(()=>d.remove(),2600); }
boot();
</script>
