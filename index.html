<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13141f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Éjjeli Járat">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Éjjeli Járat</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column — sticky HUD on top, tab bar at the bottom, illustrated scenes of the city at night in between */
:root{
  --night:#13141f; --concrete:#1d1f30; --panel:#272a42; --line:#393d5c;
  --text:#ece7da; --muted:#9a9bb4;
  --sodium:#f2a33a; --sodium-ink:#1b1206;
  --hex:#9d8bff; --ok:#5fc48b; --bad:#ec6552; --gold:#f2c230; --teal:#5fc4b4;
  --r-common:#c9c6bb; --r-uncommon:#5fd17a; --r-rare:#63b0ff; --r-epic:#d48cff; --r-special:#ffb454;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(120% 60% at 50% -10%, rgba(242,163,58,.13), transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--concrete)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:6px}

/* icons */
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.ic-gold{color:var(--gold)} .ic-coffee{color:#d9a06b} .ic-xp{color:var(--hex)} .ic-time{color:var(--muted)}
.ic-item{color:var(--r-rare)} .ic-hp{color:var(--bad)} .ic-armor{color:var(--teal)} .ic-crit{color:var(--sodium)}
.ic-str{color:#ec8a52} .ic-dex{color:var(--gold)} .ic-int{color:var(--hex)} .ic-con{color:var(--bad)} .ic-lck{color:var(--ok)}
.ic-fame{color:var(--gold)}
.with-ic{display:inline-flex;align-items:center;gap:5px}

/* art frames */
.banner{margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:360/140;max-width:100%;background:#1b1d33}
.banner svg{display:block;width:100%;height:100%}
.port{flex:none;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#3c4066,#1d1f30 78%);box-shadow:inset 0 0 0 1px var(--line)}
.port svg{display:block;width:100%;height:100%}
.itile{--rc:var(--r-common);flex:none;width:52px;height:52px;border-radius:10px;
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--rc) 30%,transparent),var(--panel) 72%);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc) 55%,transparent)}
.itile svg{display:block;width:100%;height:100%;padding:5px}
.itile.t1{--rc:var(--r-uncommon)} .itile.t2{--rc:var(--r-rare)} .itile.t3{--rc:var(--r-epic)}
.itile.t4{--rc:var(--r-special);position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px var(--r-special),0 0 12px rgba(255,180,84,.45)}
.itile.t4::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,236,190,.45) 50%,transparent 65%);background-size:250% 100%;animation:shine 2.6s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{background-position:130% 0}60%,100%{background-position:-30% 0}}
.itile.empty{background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:var(--line)}
.itile.empty svg{width:60%;height:60%;padding:0}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--concrete);border-bottom:1px solid var(--line);padding-block:10px}
.hud-row{display:flex;align-items:center;gap:12px}
.plate{flex:none;width:44px;height:44px;background:var(--sodium);color:var(--sodium-ink);border-radius:6px;display:grid;place-items:center;align-content:center;font-family:var(--f-display);font-weight:900;font-size:19px;line-height:1;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.plate small{display:block;font-size:7.5px;font-weight:700;letter-spacing:.1em;margin-top:2px}
.hud-port{width:44px;height:44px}
.hud-name{min-width:0;flex:1}
.hud-name b{display:block;font-family:var(--f-display);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:var(--panel);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--hex);transition:width .3s}
.bar.hp i{background:var(--ok)}
.chips{display:flex;gap:6px;flex:none;flex-direction:column;align-items:flex-end}
.chip-row{display:flex;gap:6px}
.auth-err{margin:0;color:var(--sodium);font-size:13px}
.remember{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.remember input{width:18px;height:18px;accent-color:var(--sodium)}
.acct{margin-top:-6px}
.acct .note{display:inline-flex;align-items:center;gap:6px}
.nm.stat-more{cursor:help}
.nm.stat-more b{text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.nm.stat-more small{display:flex;margin-top:2px;color:var(--muted)}
.nm.stat-more:hover small{color:var(--text)}
.chip.loot{cursor:help;box-shadow:inset 0 0 0 1px var(--line)}
.chip.loot:hover{box-shadow:inset 0 0 0 1px var(--sodium)}
.chip.snd{border:0;padding:3px 8px;color:var(--muted);cursor:pointer}
.chip.snd:hover{color:var(--text)}
.btn.free-btn{animation:pulse 1.4s ease-in-out infinite}
.item.veh .btn{flex-wrap:wrap;max-width:132px;text-align:center;row-gap:2px}
.pog-line{display:inline-flex;align-items:center;gap:3px;width:100%;justify-content:center}
.pog-chip{color:#f6d590}
.pog-ic{width:1.25em;height:1.25em}
.btn.pog-btn{background:#3a2f1c;color:#f6d590;box-shadow:inset 0 0 0 1px rgba(242,194,107,.45)}
.btn.pog-btn:hover{filter:brightness(1.25)}
.chip{background:var(--panel);border-radius:999px;padding:3px 10px 3px 7px;font-family:var(--f-mono);font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}

/* main */
main{flex:1;padding-block:16px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.scene{display:flex;flex-direction:column;gap:6px}
.scene h2{font-size:22px}
.scene p{margin:0;color:var(--muted);max-width:60ch}
.card{background:var(--concrete);border:1px solid var(--line);border-radius:10px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}

/* quests */
.quest{display:grid;grid-template-columns:64px 1fr;gap:4px 12px;text-align:left;width:100%;background:var(--concrete);border:1px solid var(--line);border-radius:10px;padding:12px;transition:border-color .15s,transform .15s}
.quest:hover{border-color:var(--sodium)}
.quest:active{transform:scale(.99)}
.quest .port{width:64px;height:64px;grid-row:span 3}
.quest>*{min-width:0}
.quest .where{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.district{font-family:var(--f-mono);font-weight:700;color:var(--sodium);border:1px solid currentColor;border-radius:4px;padding:0 5px;font-size:11px;display:inline-flex;align-items:center;gap:3px}
.quest h3{font-size:15px}
.quest p{margin:0;color:var(--muted);font-size:14px}
.quest .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-mono);font-size:12.5px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.diff{font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.diff-0{background:rgba(95,196,139,.15);color:var(--ok)}
.diff-1{background:rgba(242,163,58,.15);color:var(--sodium)}
.diff-2{background:rgba(236,101,82,.16);color:var(--bad)}
.quest{cursor:pointer}
.quest.busy{opacity:.6}
.quest.sel{border-color:var(--sodium);box-shadow:0 0 0 3px rgba(242,163,58,.18);background:linear-gradient(180deg,rgba(242,163,58,.07),transparent 60%),var(--concrete)}
.q-rewards{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rw{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:500}
.rw b{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.rw .ic{width:18px;height:18px}
.rw-gold{background:rgba(242,194,48,.14);color:var(--gold)}
.rw-xp{background:rgba(157,139,255,.16);color:var(--hex)}
.rw-item{background:rgba(99,176,255,.15);color:var(--r-rare)}
.rw-pog{background:#3a2f1c;color:#f6d590}
.rw-spec{background:rgba(255,180,84,.14);color:var(--r-special)}
.item.shop-it{grid-template-columns:52px 1fr auto;row-gap:8px}
.sc-row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.sc{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:4px 9px;font-size:12.5px;background:var(--panel);color:var(--text)}
.sc b{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.sc .ic{width:16px;height:16px}
.sc i{font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:700;margin-left:2px}
.sc i.up{color:var(--ok)} .sc i.down{color:var(--bad)}
.sc-dmg .ic{color:var(--sodium)} .sc-arm .ic{color:var(--teal)}
.sc-str .ic{color:#ec8a52} .sc-dex .ic{color:var(--gold)} .sc-int .ic{color:var(--hex)} .sc-con .ic{color:var(--bad)} .sc-lck .ic{color:var(--ok)}
.sc-lost{opacity:.55}
.dung-next .q-rewards{grid-column:1/-1;margin-top:4px}
.q-cost{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:8px;margin-top:2px;border-top:1px dashed var(--line)}
.q-go{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin-top:6px;animation:in .2s}
.q-go .btn{width:100%;padding:13px;font-size:15px}

.active{border-color:var(--sodium);background:linear-gradient(180deg,rgba(242,163,58,.08),transparent 70%),var(--concrete)}
.active-top{display:flex;gap:14px;align-items:center}
.active-top .port{width:88px;height:88px}
.timer{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.bigbar{height:10px;background:var(--panel);border-radius:5px;overflow:hidden}
.bigbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--sodium) 0 10px,#e08f22 10px 20px);transition:width .25s linear}

.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;background:var(--panel);transition:filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--sodium);color:var(--sodium-ink)}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.note{font-size:12px;color:var(--muted)}

/* character */
.hero{display:flex;gap:14px;align-items:center}
.hero .port{width:96px;height:96px}
.derived{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.derived div{background:var(--panel);border-radius:8px;padding:8px 4px;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.derived .ic{width:18px;height:18px}
.derived b{font-family:var(--f-mono);font-size:15px}
.derived span{font-size:11px;color:var(--muted)}
.stat{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat-ic{width:34px;height:34px;border-radius:8px;background:var(--panel);display:grid;place-items:center}
.stat-ic .ic{width:20px;height:20px}
.stat .v{font-family:var(--f-mono);font-size:17px;font-weight:700;min-width:3ch;text-align:right}
.stat .v small{color:var(--ok);font-size:12px;margin-left:3px}
.stat.main .nm>b::after{content:"fő";margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--sodium-ink);background:var(--sodium);border-radius:3px;padding:0 4px;vertical-align:2px}
.nm{min-width:0}
.nm b{font-weight:500}
.nm small{display:block;color:var(--muted);font-size:12px}
.eff{display:flex;flex-direction:column;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.eff .vals{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px}
.eff b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--text);font-weight:700}
.eff-next{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ok);font-weight:700}

.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.slot{background:var(--panel);border-radius:8px;padding:8px;min-width:0;display:flex;gap:10px;align-items:center}
.slot>div:last-child{min-width:0}
.slot .itile{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--rc) 30%,transparent),var(--concrete) 72%)}
.item-name{font-weight:700;font-size:14px}
.r0{color:var(--r-common)} .r1{color:var(--r-uncommon)} .r2{color:var(--r-rare)} .r3{color:var(--r-epic)} .item-name.r4,.r4{color:var(--r-special)}
.item-stats{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 10px}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item>div{min-width:0}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cmp-up{color:var(--ok)} .cmp-down{color:var(--bad)}
.doll{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}
.doll-col{display:flex;flex-direction:column;gap:10px}
.dslot{display:flex;flex-direction:column;align-items:center;gap:3px}
.dslot[data-tip]{cursor:help}
.dslot .itile{width:56px;height:56px;transition:transform .15s}
.dslot[data-tip]:hover .itile{transform:translateY(-2px)}
.dslot-l{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.doll-center{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.doll-center h2{font-size:19px}
.port.doll-port .worn{filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.port.doll-port{width:min(100%,230px);height:auto;aspect-ratio:1;border-radius:16px;background:radial-gradient(circle at 50% 28%,#4a4f7c,#1d1f30 72%);box-shadow:inset 0 0 0 1px var(--line),0 10px 24px rgba(0,0,0,.35)}
.wslot{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:10px;padding:8px;width:100%;text-align:left}
.wslot[data-tip]{cursor:help}
.wslot>div:last-child{min-width:0}
.tip.wide{width:min(500px,calc(100vw - 24px))}
.tip-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tip-card{min-width:0;display:flex;flex-direction:column;gap:6px}
.tip-card.worn{padding-left:10px;border-left:1px dashed var(--line)}
.tip-tag{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--sodium)}
.tip-card.worn .tip-tag{color:var(--muted)}
.tip-card .tip-head{align-items:flex-start}
.tip-card .tip-head .itile{width:40px;height:40px;border-radius:8px}
.tip-card .tip-head .itile svg{padding:4px}
.tip-card .item-name{font-size:13px;line-height:1.25}
.tip-list .tip-row,.tip-card .tip-sec .tip-row{grid-template-columns:16px 1fr auto}
.tip-card .tip-sec{margin-top:4px;padding-top:6px}
[data-drag]{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.drag-h{flex:none}
.dragging,.dragging *{cursor:grabbing!important}
.drag-ghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.drag-ghost .itile{width:56px;height:56px}
.drop-ok .itile,.bag.drop-ok,.wslot.drop-ok{box-shadow:inset 0 0 0 2px var(--sodium),0 0 0 3px rgba(242,163,58,.25)!important}
.bag.drop-ok{background:linear-gradient(180deg,rgba(242,163,58,.07),transparent 60%),var(--concrete)}
.drop-hover .itile,.bag.drop-hover,.wslot.drop-hover{box-shadow:inset 0 0 0 3px var(--ok),0 0 0 5px rgba(95,196,139,.3)!important}
.drop-hover.dslot .itile{transform:scale(1.08)}
.veh-line.expired{color:var(--bad);border-color:rgba(236,101,82,.5)}
.item.veh.own{background:rgba(242,163,58,.06);border-radius:8px}
.own-tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--sodium);color:var(--sodium-ink);border-radius:3px;padding:0 4px;vertical-align:2px}
.item[data-tip]{cursor:help;border-radius:8px;transition:background .15s}
.item[data-tip]:hover{background:rgba(255,255,255,.03)}
.tip{position:fixed;left:0;top:0;z-index:25;width:min(300px,calc(100vw - 24px));background:#0e0f18;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 14px 36px rgba(0,0,0,.55);pointer-events:none;animation:in .15s}
.tip-head{display:flex;gap:10px;align-items:center}
.tip-head>div:last-child{min-width:0}
.tip-sec{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.tip-row{display:grid;grid-template-columns:18px 1fr auto auto;gap:8px;align-items:center;font-size:13px;padding-block:3px}
.tip-row .ic{width:16px;height:16px}
.tip-row b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.d{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;text-align:right;min-width:4ch}
.d.up{color:var(--ok)} .d.down{color:var(--bad)} .d.eq{color:var(--muted)}
.tip-foot{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.tip-foot .itile{width:28px;height:28px;border-radius:7px}
.tip-foot .itile svg{padding:3px}

/* arena */
.opp{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.opp:last-child{border-bottom:0}
.opp .port{width:56px;height:56px}
.opp>div{min-width:0}

/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--concrete);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab .lock-mini{position:absolute;top:6px;right:calc(50% - 20px);color:var(--muted)}

.upg{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}

.gw-n.r{text-align:right}

.gw-duel.win .gw-r{color:var(--ok)} .gw-duel.lose .gw-r{color:var(--bad)}

.cls{display:grid;grid-template-columns:76px 1fr;gap:4px 14px;text-align:left;background:var(--concrete);border:2px solid var(--line);border-radius:12px;padding:12px;align-items:start}

.fighter.right{text-align:right;align-items:flex-end}
.fighter.right .bar{width:100%}
.fighter b{display:block;font-family:var(--f-display);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fighter .hpnum{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.vs{font-family:var(--f-display);font-weight:900;color:var(--sodium);font-size:14px;padding-bottom:30px}
.fighter.right .bar i{margin-left:auto}
.sheet,.versus{position:relative}
.pw{position:relative}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--f-display);font-weight:900;font-size:18px;white-space:nowrap;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.7);pointer-events:none;z-index:4}
.float.dmg{color:var(--bad)} .float.crit{color:var(--gold);font-size:23px} .float.dodge{color:var(--teal)} .float.miss{color:var(--muted)} .float.block{color:#9ec0f0}
.fx-slash{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);z-index:3;overflow:visible;pointer-events:none}
.fx-shield{position:absolute;inset:6%;z-index:3;pointer-events:none}
.fx-shield svg{width:100%;height:100%}
.wpn{position:absolute;left:0;top:0;z-index:6;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.55));transform-origin:50% 80%}

.bolt.shot{width:14px;height:14px;background:radial-gradient(circle,#fff 0 25%,var(--sodium) 50%,transparent 72%);box-shadow:0 0 10px var(--sodium)}
.bolt{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,var(--hex) 45%,transparent 70%);box-shadow:0 0 16px var(--hex);z-index:5;pointer-events:none}
.port.ko{filter:grayscale(1) brightness(.55);transform:rotate(-8deg) translateY(6px);transition:filter .5s,transform .5s}
.fighter.right .port.ko{transform:rotate(8deg) translateY(6px)}
.ko-stamp{position:absolute;left:42px;top:42px;transform:translate(-50%,-50%) rotate(-12deg);font-family:var(--f-display);font-weight:900;font-size:20px;color:var(--bad);border:3px solid var(--bad);border-radius:6px;padding:0 6px;background:rgba(19,20,31,.75);animation:stamp .35s cubic-bezier(.3,1.6,.5,1) both;z-index:4}
.fighter.right .ko-stamp{left:auto;right:42px;transform:translate(50%,-50%) rotate(12deg);animation-name:stamp-r}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);opacity:0}}
@keyframes stamp-r{from{transform:translate(50%,-50%) rotate(12deg) scale(2.4);opacity:0}}
.port.win{animation:bounce .6s ease 2}

.result{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}

.rewards>*{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.rewards>*:nth-child(2){animation-delay:.12s}.rewards>*:nth-child(3){animation-delay:.24s}.rewards>*:nth-child(4){animation-delay:.36s}
.coin-burst{position:absolute;left:0;top:0;width:18px;height:18px;color:var(--gold);pointer-events:none;z-index:6}
.coin-burst .ic{width:18px;height:18px}
.active.depart{animation:depart .45s ease-out}

.active.depart .port{animation:bob 1.6s ease-in-out infinite}

.active.arrived{animation:arrive 1.2s ease-out}

.active.arrived .port{animation:menace .9s ease-in-out infinite}
@keyframes menace{50%{transform:scale(1.06)}}
.btn.pulse{animation:pulse 1.4s ease-in-out infinite}

.plate.lvlup{animation:lvl 1s ease 2}
.lv-overlay{align-items:center;padding:12px}
.lv-card{position:relative;overflow:hidden;width:min(420px,100%);max-height:100%;overflow-y:auto;background:radial-gradient(120% 60% at 50% 0%,rgba(242,163,58,.16),transparent 60%),var(--concrete);border:2px solid var(--sodium);border-radius:18px;padding:22px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}

.lv-list{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left;margin-top:4px}
.lv-row{display:grid;grid-template-columns:20px 1fr auto auto;gap:8px;align-items:center;background:var(--panel);border-radius:8px;padding:8px 10px;font-size:13.5px;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}

.lv-row:nth-child(1){animation-delay:1.4s}.lv-row:nth-child(2){animation-delay:1.52s}.lv-row:nth-child(3){animation-delay:1.64s}.lv-row:nth-child(4){animation-delay:1.76s}.lv-row:nth-child(5){animation-delay:1.88s}.lv-row:nth-child(6){animation-delay:2s}.lv-row:nth-child(7){animation-delay:2.1s}

const RENT_MS=7*24*3600*1000;
function activeVeh(){ const r=state.vehicle; if(!r||!r.id||r.until<=now()) return null; return VEHICLES.find(x=>x.id===r.id)||null; }
function fmtLeft(ms){ const m=Math.max(1,Math.floor(ms/60000)), d=Math.floor(m/1440), h=Math.floor(m%1440/60); return d?`${d} nap ${h} óra`:h?`${h} óra ${m%60} perc`:`${m} perc`; }
function mountRed(){ const v=activeVeh(); return v?v.red:0; }
function effDur(q){ return Math.max(3,Math.round(q.dur*(1-mountRed()))); }
function qCost(q){ const v=activeVeh(), d=v&&v.coffee?effDur(q):q.dur; return Math.max(1,Math.round((Math.round(d*.8)+5)*.24)); }
/* double espresso: pogácsa only, +40 coffee, max 10 per day */
const ESPRESSO_GAIN=40, ESPRESSO_DAILY=10;
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function espressoLeft(){ return state.coffeeDay===todayKey()?Math.max(0,ESPRESSO_DAILY-(state.coffeeCount||0)):ESPRESSO_DAILY; }
function canEspresso(){ return espressoLeft()>0&&(state.pog||0)>=1&&state.energy<ENERGY_MAX; }

// a newer dungeon never starts easier than the previous one's 8th floor
function floorPower(d,fl){

  const s=effStats(equip), w=equip.fegyver||{min:1,max:3}, m=s[CLASSES[state.cls].main], lvl=state.level;
  return {dmg:dmgRange(w,m), dmgAvg:(w.min+w.max+2*m*STAT_DMG)*CLASSES[state.cls].dmg*(CLASSES[state.cls].hits||1), hp:maxHp(s.con,lvl,state.cls),
    armor:armorRed({cls:state.cls,armor:totalArmor(equip),level:lvl}), crit:critChance({stats:s,level:lvl}),
    res:Object.fromEntries(['str','dex','int'].map(k=>[k,resist(s[k],lvl)]))};
}
function tipRow(icon,label,val,d){ const c=!d?'eq':d>0?'up':'down'; return `<div class="tip-row">${icon}<span>${label}</span><b>${val}</b><span class="d ${c}">${d?sgn(d):'='}</span></div>`; }

function placeTip(row){
  const r=row.getBoundingClientRect(), t=tipEl.getBoundingClientRect(), W=innerWidth, H=innerHeight; let x,y;

  else { x=Math.min(Math.max(8,r.left+(r.width-t.width)/2),W-t.width-8); y=r.bottom+8+t.height<=H-76?r.bottom+8:Math.max(8,r.top-8-t.height); }
  tipEl.style.left=x+'px'; tipEl.style.top=y+'px';
}

function armorRed(f){return Math.min(CLASSES[f.cls].maxArmor, f.armor/Math.max(1,f.level*10))}
function playerFighter(){
  const s=effStats(), w=state.equip.fegyver;
  return {name:state.name, cls:state.cls, level:state.level, stats:s, wMin:w?w.min:1, wMax:w?w.max:3, armor:totalArmor(), hp:maxHp(s.con,state.level,state.cls), art:CLASS_ART[state.cls], wpn:w&&w.base};
}
// enemies ramp up gently over the first levels, then catch up with the normal curve by level 9
function enemyLvl(l){ return 1+(l-1)*ENEMY_GROW; }
function genFighter(name, lvl, mult, cls){
  cls = cls || pick(Object.keys(CLASSES));
  const m=CLASSES[cls].main, e=enemyLvl(lvl);
  const s={str:Math.round(3+e),dex:Math.round(3+e),int:Math.round(3+e),con:Math.round((5+e*2.5+rand(0,Math.round(e)))*mult),lck:Math.round(3+e)+rand(0,Math.round(e))};
  s[m]=Math.round((6+e*2.5+rand(0,Math.round(e)))*mult);
  return {name, cls, level:lvl, stats:s, wMin:Math.round((e*1.6+2)*mult), wMax:Math.round((e*2.4+4)*mult), armor:Math.round(e*rand(5,9)*mult), hp:maxHp(s.con,e,cls)};
}

/* ================= generation ================= */
function genQuests(){
  const used=new Set(), out=[];
  for(let d=0; d<3; d++){
    let q; do{ q=pick(QUESTS); }while(used.has(q[1])); used.add(q[1]);
    const lvl=state.level, dur=rand(8,24);
    out.push({id:uid(), district:q[0], title:q[1], desc:q[2], enemy:q[3], diff:d, mult:questMult(d,lvl), dur, cost:Math.round(dur*.8)+5,
      gold:Math.round((5+lvl*6+rand(0,lvl*3))*(.7+d*.45)), xp:Math.round((14+lvl*9)*(.7+d*.45)+dur*.6), drop:Math.random()<[.06,.12,.22][d], pog:Math.random()<POG_RATE.quest[d]});
  }
  return out.sort(()=>Math.random()-.5);
}
let SHOP_FX=false;
// new stock: make sure every item is actually new, show it with a short shuffle animation
function reshop(){ const old=new Set((state.shop||[]).map(x=>x.name)); let n=genShop(), tries=0; while(tries++<5&&n.filter(x=>old.has(x.name)).length>2) n=genShop();
  state.shop=n; save(); SHOP_FX=true; render(); SHOP_FX=false; const c=$('#shoplist'); if(c&&c.getBoundingClientRect().top<0) c.scrollIntoView({behavior:'smooth',block:'start'}); }
function genShop(){ const l=state.level, others=SLOTS.map(s=>s[0]).filter(k=>k!=='fegyver').sort(()=>Math.random()-.5).slice(0,6); return [genItem(l,'fegyver'),genItem(l,'fegyver'),...others.map(k=>genItem(l,k))]; }
function genArena(){
  syncLadder();
  const L=state.ladder, i=L.findIndex(e=>e.me); let idx=[];
  for(let j=Math.max(0,i-6);j<i;j++) idx.push(j);
  if(idx.length<3) for(let j=i+1;j<L.length&&idx.length<3;j++) idx.push(j);
  idx=idx.sort(()=>Math.random()-.5).slice(0,3).sort((a,b)=>a-b);
  return idx.map(j=>{ const e=L[j]; if(e.real){ const st=REAL[e.cid]; if(st){ const f=heroFighter(st); f.id=e.id; f.rank=j+1; return f; } }
    const f=genFighter(e.name||'Ismeretlen',entryLevel(e),.9+Math.random()*.12,e.cls||'kidobo'); f.id=e.id; f.rank=j+1; return f; });
}

/* ================= combat ================= */
function strike(att, def, followUp){
  const ac=CLASSES[att.cls], dc=CLASSES[def.cls], mag=att.cls==='magus';
  if(!mag && Math.random()<MISS) return {dmg:0,miss:true};
  if(!mag && dc.dodge && Math.random()<dc.dodge) return {dmg:0,dodge:true};
  if(!mag && !followUp && dc.block && Math.random()<dc.block) return {dmg:0,block:true}; // a quick follow-up stab slips past the shield
  const m=ac.main;
  let dmg = (rand(att.wMin, att.wMax) + att.stats[m]*STAT_DMG) * ac.dmg * (1 - resist(def.stats[m], def.level));
  if(att.cls!=='magus') dmg *= 1-armorRed(def);
  const crit=Math.random()<critChance(att); if(crit) dmg*=2;
  return {dmg:Math.max(1,Math.round(dmg)), crit};
}
function simulate(a,b){
  let hA=a.hp, hB=b.hp, t=Math.random()<.5?0:1, log=[], n=0;
  while(hA>0 && hB>0 && n<300){ const att=t?b:a, hits=CLASSES[att.cls].hits||1;
    for(let h=0;h<hits&&hA>0&&hB>0;h++){ const r=strike(att, t?a:b, h>0); if(t) hA=Math.max(0,hA-r.dmg); else hB=Math.max(0,hB-r.dmg); log.push({...r, side:t, hA, hB, extra:h>0}); n++; }
    t=1-t; }
  // a fight always ends with a knockout: if it drags on, the one in worse shape runs out of breath
  if(hA>0&&hB>0){ const aWins=hA/(a.maxHp||a.hp)>=hB/(b.maxHp||b.hp); if(aWins){ log.push({dmg:hB,side:0,hA,hB:0,finish:true}); hB=0; } else { log.push({dmg:hA,side:1,hA:0,hB,finish:true}); hA=0; } }
  return {log, win: hB<=0};
}
const VERBS={kidobo:['behúz egyet','meglendíti a fegyverét','vállal nekiront'],magus:['villámot szór','átkot mormol','kicsavarja a valóságot'],futar:['rálő a csúzlival','célzott lövést ad le','messziről eltalálja'],zsebmetszo:['beszúr','villámgyorsan vág','oldalba döfi']};
function logLine(e,a,b){
  const att=e.side?b:a, def=e.side?a:b;
  if(e.finish) return `<div class="${e.side?'them':'me'} crit">${esc(def.name)} kifulladt, ${esc(att.name)} kiüti: <span class="mono">−${e.dmg}</span></div>`;
  if(e.extra&&!e.dodge&&!e.miss&&!e.block) return `<div class="${e.side?'them':'me'}${e.crit?' crit':''}">…és még egyszer: <span class="mono">−${e.dmg}</span>${e.crit?' kritikus!':''}</div>`;
  if(e.dodge) return `<div class="${e.side?'them':'me'} dodge">${esc(def.name)} elhajol ${esc(att.name)} elől.</div>`;
  if(e.miss) return `<div class="${e.side?'them':'me'} dodge">${esc(att.name)} nagyot suhint, de mellé.</div>`;
  if(e.block) return `<div class="${e.side?'them':'me'} dodge">${esc(def.name)} pajzzsal hárítja ${esc(att.name)} ütését.</div>`;
  return `<div class="${e.side?'them':'me'}${e.crit?' crit':''}">${esc(att.name)} ${pick(VERBS[att.cls])}: <span class="mono">−${e.dmg}</span>${e.crit?' kritikus!':''}</div>`;
}

/* ================= progression ================= */
function gainXp(x){
  state.xp+=x; let ups=0; const from=state.level, hpFrom=maxHp(effStats().con,from,state.cls);
  while(state.xp>=xpNeed(state.level)){ state.xp-=xpNeed(state.level); state.level++; ups++; }
  if(ups) lvlGain(state,ups);
  if(ups){ state.pog=(state.pog||0)+ups; state.freeReshop=true; state.arena=genArena(); lvlFx={pog:(lvlFx?lvlFx.pog||0:0)+ups, from:lvlFx?lvlFx.from:from, hpFrom:lvlFx?lvlFx.hpFrom:hpFrom, to:state.level, hpTo:maxHp(effStats().con,state.level,state.cls)}; }
}

/* ---- save slots: every hero is kept, the roster remembers who was played last ---- */
const ROSTER_KEY='ejjeli-jarat-roster', CHAR_PREFIX='ejjeli-jarat-char-', MAX_CHARS=6;
function readRoster(){ try{ const r=JSON.parse(localStorage.getItem(ROSTER_KEY)||'null'); if(r&&Array.isArray(r.ids)) return r; }catch(e){} return {current:null,ids:[]}; }
function writeRoster(r){ try{ localStorage.setItem(ROSTER_KEY,JSON.stringify(r)); }catch(e){} }
function readChar(id){ try{ const s=localStorage.getItem(CHAR_PREFIX+id); return s?JSON.parse(s):null; }catch(e){ return null; } }
function save(){
  if(!state) return;
  if(!state.cid) state.cid=(crypto.randomUUID?crypto.randomUUID():uid()+uid()+uid());
  state.savedAt=now();
  try{ localStorage.setItem(CHAR_PREFIX+state.cid, JSON.stringify(state)); }catch(e){}
  const r=readRoster(); if(!r.ids.includes(state.cid)) r.ids.push(state.cid); r.current=state.cid; writeRoster(r);
  cloudSave(state);
}
function load(){
  let r=readRoster();
  if(!r.ids.length){ // move the old single save into the roster
    try{ const old=localStorage.getItem(SAVE_KEY); if(old){ const st=JSON.parse(old); st.cid=st.cid||uid(); localStorage.setItem(CHAR_PREFIX+st.cid,JSON.stringify(st)); r={current:st.cid,ids:[st.cid]}; writeRoster(r); localStorage.removeItem(SAVE_KEY); } }catch(e){}
  }
  return r.current?readChar(r.current):null;
}
function listChars(){ return readRoster().ids.map(id=>readChar(id)).filter(Boolean).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0)); }
function leaveChar(){ save(); flushCloud(); const r=readRoster(); r.current=null; writeRoster(r); state=null; hideTip(); $('#overlay-root').innerHTML=''; battle=null; render(); window.scrollTo(0,0); }
function enterChar(id){
  const st=readChar(id); if(!st) return;
  state=migrate(st); if(!(state.arena[0]&&state.arena[0].rank)) state.arena=genArena();
  view='terkep'; lvlFx=false; syncLadder(); save(); render(); window.scrollTo(0,0);
  const fresh=(state.arenaLog||[]).filter(l=>l.at>(state.seenLog||0));
  if(fresh.length){ state.seenLog=now(); save(); toast(`${fresh.length} támadás ért az arénában, amíg távol voltál. Nézd meg az Arénában!`); }
  loadOnlineLogs(true);
}
function deleteChar(id){
  if(SB&&ONLINE.user) SB.from('characters').delete().eq('id',id).then(()=>{});
  try{ localStorage.removeItem(CHAR_PREFIX+id); }catch(e){}
  const r=readRoster(); r.ids=r.ids.filter(x=>x!==id); if(r.current===id) r.current=null; writeRoster(r); render();
}

/* dice poker against Ica */
const HAND_NAME=['Semmi','Pár','Két pár','Drill','Kissor','Nagysor','Full','Póker','Ötös'];
function handScore(d){
  const cnt={}; d.forEach(v=>cnt[v]=(cnt[v]||0)+1);
  const g=Object.entries(cnt).map(([v,c])=>[c,+v]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]), cs=g.map(x=>x[0]).join(''), vals=g.map(x=>x[1]);
  const srt=[...d].sort().join('');
  const cat=cs==='5'?8:cs==='41'?7:cs==='32'?6:srt==='23456'?5:srt==='12345'?4:cs==='311'?3:cs==='221'?2:cs==='2111'?1:0;
  return [cat,...vals];
}
function cmpScore(a,b){ for(let i=0;i<Math.max(a.length,b.length);i++){ const x=a[i]||0,y=b[i]||0; if(x!==y) return x>y?1:-1; } return 0; }
// Ica keeps her best group (or a near-straight) and rerolls the rest
function icaKeep(d){
  const sc=handScore(d); if(sc[0]>=4&&sc[0]!==7) return d.map(()=>true);
  const cnt={}; d.forEach(v=>cnt[v]=(cnt[v]||0)+1);
  const uniq=[...new Set(d)].sort(); if(Math.max(...Object.values(cnt))===1){ const hi=uniq.includes(6)&&!uniq.includes(1); const keep=new Set(hi?[2,3,4,5,6]:[1,2,3,4,5]); const used=new Set(); return d.map(v=>{ if(keep.has(v)&&!used.has(v)){ used.add(v); return true; } return false; }); }
  const keepVals=new Set(Object.entries(cnt).filter(([v,c])=>c>=2).map(([v])=>+v));
  if(sc[0]===2&&Math.random()<.5){ const lo=Math.min(...keepVals); keepVals.delete(lo); }
  return d.map(v=>keepVals.has(v));
}
let PK=null;

  return `<svg viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="18" fill="#f4efe6" stroke="#13141f" stroke-width="5"/>${P.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="${v===1?'#c0392b':'#13141f'}"/>`).join('')}</svg>`; };
function pokerStakes(cur){ const L=state.level; return cur==='pog'?[1,3,5]:[Math.round((20+L*10)/5)*5,Math.round((50+L*30)/10)*10,Math.round((100+L*80)/10)*10]; }

const r6=()=>1+Math.floor(Math.random()*6);
function pokerBet(v){
  dayReset(); if(state.pokerCount>=POKER_DAILY) return;
  if(PK.cur==='pog'){ if(!spendPog(v)) return; } else { if(state.gold<v) return toast('Nincs elég forintod.'); state.gold-=v; }
  state.pokerCount++; save();
  PK={...PK,phase:'play',stake:v,me:[r6(),r6(),r6(),r6(),r6()],held:[0,0,0,0,0].map(()=>false),rolls:1,rolling:[0,1,2,3,4],ica:null,msg:''};
  sfx('clink'); renderPoker(); setTimeout(()=>{ if(PK) { PK.rolling=null; } },500);
}
function pokerRoll(){ if(PK.rolls>=3) return; const idx=[]; PK.me=PK.me.map((v,i)=>{ if(PK.held[i]) return v; idx.push(i); return r6(); }); PK.rolls++; PK.rolling=idx; sfx('clink'); renderPoker(); PK.rolling=null; if(PK.rolls>=3) setTimeout(pokerStand,700); }
function pokerStand(){
  if(!PK||PK.phase!=='play') return; PK.phase='ica'; PK.held=null; const ms=handScore(PK.me);
  PK.ica=[r6(),r6(),r6(),r6(),r6()]; PK.icaRolling=[0,1,2,3,4]; PK.msg='Ica dob…'; renderPoker(); sfx('clink');
  let n=1; const step=()=>{
    if(!PK) return;
    const beat=cmpScore(handScore(PK.ica),ms)>0;
    if(n<3&&!beat){ const k=icaKeep(PK.ica), idx=[]; PK.ica=PK.ica.map((v,i)=>{ if(k[i]) return v; idx.push(i); return r6(); }); n++; PK.icaRolling=idx; PK.msg=`Ica újradob (${idx.length} kocka)…`; sfx('clink'); renderPoker(); setTimeout(step,1100); return; }
    const c=cmpScore(ms,handScore(PK.ica)), pog=PK.cur==='pog';
    if(c>0){ if(pog) state.pog+=PK.stake*2; else state.gold+=PK.stake*2; PK.msg=`<b class="win">Nyertél! +${pog?PK.stake*2+' pogácsa':fmt(PK.stake*2)+' Ft'}</b>`; sfx('win'); }
    else if(c===0){ if(pog) state.pog+=PK.stake; else state.gold+=PK.stake; PK.msg='Döntetlen, visszakaptad a téted.'; sfx('pop'); }
    else { PK.msg=`<b class="lose">Ica nyert.</b> „Legközelebb, drágám.”`; sfx('lose'); }
    PK.phase='done'; PK.icaRolling=null; save(); render(); renderPoker(); };
  setTimeout(step,1100);
}

      return {txt:`${state.quests.length} bejelentés`};
    case 'bolt': return state.freeReshop?{txt:'Ingyen új kínálat',hot:true}:{txt:'Non-stop'};
    case 'garazs': { const v=activeVeh(); return v?{txt:`${v.name} · ${fmtLeft(state.vehicle.until-t)}`}:{txt:'Gyalog jársz'}; }
    case 'arena': { const l=state.arenaReadyAt-t, rk=state.ladder.findIndex(e=>e.me)+1; return l>0?{txt:`#${rk} · <span id="m-a">${fmtTime(l)}</span>`}:{txt:`#${rk} · Kihívás!`,hot:true}; }
    case 'kazamata': { if(state.level<DUNGEON_UNLOCK) return {txt:`${DUNGEON_UNLOCK}. szinttől`}; const l=(state.dungeonReadyAt||0)-t; return l>0?{txt:`Pihenő · <span id="m-d">${fmtTime(l)}</span>`}:{txt:'Lemerülhetsz',hot:true}; }

}

function dungList(list,left){
  const firstLocked=list.findIndex(d=>dungLocked(d)); let html='';

  if(done.length>1) html+=`<details class="card dung-done-list"><summary>${ic('trophy')}Teljesített kazamaták · ${done.length}</summary>${done.map(d=>`<div class="dung-mini">${portrait(ENEMY_ART['boss_'+d.id],d.dawn?'dawn':'')}<div><b>${d.name}</b><div class="note">${d.unlock}. szint · ${esc(d.floors[9])} legyőzve</div></div></div>`).join('')}</details>`;
  list.forEach((d,i)=>{ if((firstLocked<0||i<=firstLocked)&&!(done.length>1&&done.includes(d))) html+=dungCard(d,left); });

}

async function stepBattle(){

  const e=B.res.log[B.i++], k=B.k;
  // long guild duels: animate the opening blows, then let the rest run quickly
  if(!(B.guild&&B.i>10)) await playFx(e); else if(B.i%4===0) sfx('hit');

function boltFx(fromPw,toPw,cls='bolt'){

/* the attacker's own weapon appears and is used: swing, stab, cast or shoot */
function weaponFx(att,ap,dp,dir){
  return new Promise(res=>{
    if(RM) return res();
    const v=$('.versus'), vr=v.getBoundingClientRect(), a=ap.getBoundingClientRect(), b=dp.getBoundingClientRect();
    const base=att.wpn||WEAPONS[att.cls][0], art=ITEM_ART[base]||ITEM_DEFAULT, el=document.createElement('div');
    el.className='wpn'; el.innerHTML=svg(art); v.appendChild(el);
    const W=Math.min(a.width,b.width)*.62, ax=a.left-vr.left+a.width/2-W/2, ay=a.top-vr.top+a.height/2-W/2, bx=b.left-vr.left+b.width/2-W/2, by=b.top-vr.top+b.height/2-W/2;
    el.style.width=el.style.height=W+'px';
    const fx=dir<0?' scaleX(-1)':'', T=(x,y,r,sc=1)=>`translate(${x}px,${y}px) rotate(${r*dir}deg) scale(${sc})${fx}`;
    let frames, dur, hit;
    if(att.cls==='kidobo'){ // big overhead swing that lands on the enemy
      frames=[{transform:T(ax,ay-10,-80,.7),opacity:0},{transform:T(ax+dir*10,ay-24,-110,1),opacity:1,offset:.25},{transform:T(bx-dir*W*.35,by-6,25,1.1),opacity:1,offset:.6},{transform:T(bx-dir*W*.3,by,40,1),opacity:1,offset:.75},{transform:T(bx-dir*W*.45,by+6,35,.9),opacity:0}];
      dur=560; hit=.6;
    } else if(att.cls==='zsebmetszo'){ // quick stab with the blades
      frames=[{transform:T(ax,ay,0,.7),opacity:0},{transform:T(ax+dir*14,ay-6,-25,1),opacity:1,offset:.25},{transform:T(ax+dir*22,ay-8,-35,1),opacity:1,offset:.42},{transform:T(bx-dir*W*.3,by,10,1.05),opacity:1,offset:.65},{transform:T(bx-dir*W*.32,by,12,1.05),opacity:1,offset:.8},{transform:T(bx-dir*W*.5,by,0,.9),opacity:0}];
      dur=620; hit=.65;
    } else if(att.cls==='magus'){ // raise the focus, it glows, then the spell flies
      el.classList.add('glow');
      frames=[{transform:T(ax+dir*W*.3,ay+10,10,.6),opacity:0},{transform:T(ax+dir*W*.35,ay-18,-25,1.05),opacity:1,offset:.45},{transform:T(ax+dir*W*.35,ay-22,-30,1.1),opacity:1,offset:.75},{transform:T(ax+dir*W*.3,ay-10,-10,.9),opacity:0}];
      dur=420; hit=.75;
    } else { // ranged: aim, pull back, release
      frames=[{transform:T(ax+dir*W*.4,ay,0,.7),opacity:0},{transform:T(ax+dir*W*.45,ay-4,-8,1),opacity:1,offset:.3},{transform:T(ax+dir*W*.3,ay-4,-8,1)+' scaleX(.85)',opacity:1,offset:.65},{transform:T(ax+dir*W*.5,ay-4,-8,1),opacity:1,offset:.78},{transform:T(ax+dir*W*.45,ay,0,.9),opacity:0}];
      dur=420; hit=.78;
    }
    el.animate(frames,{duration:dur,easing:'cubic-bezier(.4,.1,.3,1)'}).onfinish=()=>el.remove();
    setTimeout(res,dur*hit);
  });
}
async function playFx(e){
  const B=battle, attEl=$(e.side?'#fb':'#fa'), defEl=$(e.side?'#fa':'#fb');
  const ap=attEl.querySelector('.pw'), dp=defEl.querySelector('.pw'), aPort=ap.querySelector('.port'), dPort=dp.querySelector('.port');
  const att=e.side?B.b:B.a, dir=e.side?-1:1;
  if(!RM) aPort.animate([{transform:'none'},{transform:`translateX(${dir*26}px) rotate(${dir*8}deg) scale(1.08)`},{transform:'none'}],{duration:360,easing:'cubic-bezier(.3,.7,.4,1)'});
  sfx('attack_'+att.cls);
  if(!e.finish) await weaponFx(att,ap,dp,dir);
  if(att.cls==='magus') await boltFx(ap,dp);
  else if(CLASSES[att.cls].ranged) await boltFx(ap,dp,'bolt shot');
  else if(!e.dodge&&!e.miss) slashFx(dp,att.cls,dir<0);
  if(battle!==B||B.ended) return;
  sfx(e.miss?'miss':e.dodge?'dodge':e.block?'block':e.crit?'crit':'hit');
  if(e.miss){
    floatText(dp,'Mellé!','miss');
    if(!RM){ aPort.animate([{transform:'none'},{transform:`translateX(${dir*10}px) rotate(${-dir*12}deg)`},{transform:'none'}],{duration:320,delay:180}); }
  } else if(e.dodge){
    floatText(dp,'Kitért!','dodge');
    if(!RM){ dPort.animate([{transform:'none',opacity:1},{transform:`translateX(${dir*30}px) skewX(${-dir*12}deg)`,opacity:.35,offset:.35},{transform:'none',opacity:1}],{duration:440,easing:'ease-out'}); setTimeout(()=>slashFx(dp,att.cls,dir<0),60); }
  } else if(e.block){
    shieldFx(dp); floatText(dp,'Hárítva!','block');
    if(!RM) dPort.animate([{transform:'none'},{transform:`translateX(${dir*7}px)`},{transform:'none'}],{duration:220});
  } else {
    floatText(dp,`−${e.dmg}${e.crit?' KRIT!':''}`,e.crit?'crit':'dmg');
    if(!RM){
      dPort.animate([{transform:'none',filter:'none'},{transform:`translateX(${dir*8}px) rotate(${dir*5}deg)`,filter:'brightness(1.6) sepia(1) hue-rotate(-50deg) saturate(5)',offset:.2},{transform:`translateX(${-dir*5}px)`,offset:.5},{transform:'none',filter:'none'}],{duration:380});
      if(e.crit) $('.sheet').animate([{transform:'none'},{transform:'translate(5px,-3px)'},{transform:'translate(-5px,3px)'},{transform:'translate(3px,0)'},{transform:'none'}],{duration:300});
    }
  }
}

/* ---------- guilds with real players: invites live in the guild_invites table ---------- */

function pendingDonations(){ const mo=state.memberOf; return mo?GI.myDon.filter(d=>d.leader_char===mo.leaderCid&&d.from_char===state.cid).reduce((a,d)=>a+d.amount,0):0; }

  if(IS_APP) return '';
  if(INSTALL_EVT) return `<section class="card install-card"><img src="icon-192.png" alt="" width="48" height="48"><div><b>Telepítsd appként</b><div class="note">Saját ikon a főképernyőn, teljes képernyő, böngészősáv nélkül.</div></div><button class="btn small primary" data-act="installapp">Telepítés</button></section>`;
  if(IS_IOS) return `<details class="card install-card ios"><summary><img src="icon-192.png" alt="" width="48" height="48"><div><b>Telepítsd appként</b><div class="note">Koppints ide, és megmutatom, hogyan.</div></div></summary><ol class="note"><li>Nyisd meg ezt az oldalt <b>Safariban</b>.</li><li>Koppints lent a <b>Megosztás</b> gombra (négyzet felfelé nyíllal).</li><li>Válaszd a <b>Főképernyőhöz adás</b> lehetőséget, majd a <b>Hozzáadás</b>t.</li><li>Ezután a főképernyőn lévő ikonnal indítsd, teljes képernyőn fut.</li></ol></details>`;
  return `<details class="card install-card"><summary><img src="icon-192.png" alt="" width="48" height="48"><div><b>Telepítsd appként</b><div class="note">Koppints ide, és megmutatom, hogyan.</div></div></summary><ol class="note"><li>Androidon nyisd meg <b>Chrome</b>-ban.</li><li>Koppints a jobb felső <b>⋮</b> menüre.</li><li>Válaszd az <b>Alkalmazás telepítése</b> vagy <b>Hozzáadás a kezdőképernyőhöz</b> pontot.</li></ol></details>`;
}
function renderNoConfig(){
  return `<div class="create wrap">${banner('skyline')}<div class="logo">Éjjeli<br><span>Járat</span></div>
    <section class="card stack"><h3>A szerver még nincs beállítva</h3><p class="muted" style="margin:0">Töltsd ki a <b>config.js</b> fájlban a Supabase projekt címét és az anon kulcsot, aztán töltsd újra az oldalt.</p></section></div>`;
}
function renderAuth(){
  const su=ONLINE.mode==='signup';
  return `<div class="create wrap">${banner('skyline')}<div class="logo">Éjjeli<br><span>Járat</span></div>
    <p class="tag">Éjfél után a városban más lakik a lépcsőházakban. Lépj be, és a hőseid minden eszközödön veled lesznek.</p>
    <form class="card stack" id="authf" onsubmit="event.preventDefault();doAuth()">
      <span class="label">${ic('user')}${su?'Regisztráció':'Belépés'}</span>
      <div class="field"><label class="label" for="em">E-mail</label><input id="em" name="email" type="email" autocomplete="${su?'email':'username'}" value="${esc(rememberedEmail())}" required></div>
      <div class="field"><label class="label" for="pw">Jelszó</label><input id="pw" name="password" type="password" autocomplete="${su?'new-password':'current-password'}" minlength="6" required></div>
      <label class="remember"><input type="checkbox" id="rem" ${rememberOn()?'checked':''}> Emlékezz rám ezen az eszközön</label>
      ${ONLINE.err?`<p class="auth-err">${esc(ONLINE.err)}</p>`:''}
      <button class="btn primary" type="submit" ${ONLINE.busy?'disabled':''}>${ONLINE.busy?'Pillanat…':su?'Fiók létrehozása':'Belépés'}</button>
      <button class="btn small" type="button" data-act="authmode">${su?'Van már fiókom, belépek':'Még nincs fiókom, regisztrálok'}</button>
    </form>${installCard()}</div>`;
}
function rememberOn(){ try{ return localStorage.getItem('ej-remember')!=='0'; }catch(e){ return true; } }
function rememberedEmail(){ try{ return rememberOn()?(localStorage.getItem('ej-email')||''):''; }catch(e){ return ''; } }
async function doAuth(){
  const rem=$('#rem')?$('#rem').checked:true;
  try{ localStorage.setItem('ej-remember',rem?'1':'0'); if(rem) localStorage.setItem('ej-email',($('#em')?.value||'').trim()); else localStorage.removeItem('ej-email'); }catch(e){}
  const em=($('#em')?.value||'').trim(), pw=$('#pw')?.value||''; if(!em||pw.length<6){ ONLINE.err='Adj meg egy e-mail-címet és legalább 6 karakteres jelszót.'; render(); return; }
  ONLINE.busy=true; ONLINE.err=''; render(); $('#em').value=em; $('#pw').value=pw; if($('#rem')) $('#rem').checked=rem;
  try{
    const r= ONLINE.mode==='signup' ? await SB.auth.signUp({email:em,password:pw}) : await SB.auth.signInWithPassword({email:em,password:pw});
    if(r.error) throw r.error;
    if(!r.data.session){ ONLINE.mode='login'; ONLINE.err='Kész! Nézd meg az e-mailed, erősítsd meg a címed, aztán lépj be.'; ONLINE.busy=false; render(); return; }
    ONLINE.user=r.data.session.user; ONLINE.busy=false; await afterLogin();
  }catch(e){ ONLINE.busy=false; const m=String(e.message||e); ONLINE.err=/Invalid login/i.test(m)?'Hibás e-mail vagy jelszó.':/already registered/i.test(m)?'Ezzel a címmel már van fiók. Lépj be.':m; render(); }
}
async function afterLogin(){
  try{ await pullRoster(); }catch(e){ toast('Nem sikerült betölteni a hőseidet. Próbáld újra.'); }
  const st=load(); state=st?migrate(st):null;
  if(state){ if(!(state.arena[0]&&state.arena[0].rank)) state.arena=genArena(); syncLadder(); view='terkep'; loadOnlineLogs(true); }
  render(); window.scrollTo(0,0);
}
async function boot(){
  setInterval(()=>tick(false),250);
  if(!SB){ render(); return; }
  SB.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ ONLINE.user=null; ONLINE.mode='login'; ONLINE.err=''; state=null; ONLINE.players=[]; ONLINE.logs=[]; render(); } });
  const {data:{session}}=await SB.auth.getSession();
  if(session){ ONLINE.user=session.user; await afterLogin(); } else render();
}
/* ================= loop ================= */
function tick(force){
  if(!state) return;
  const t=now();
  // coffee does not trickle back; the pot is refilled once a day at midnight
  if(state.energyDay!==todayKey()){ state.energyDay=todayKey(); state.energy=ENERGY_MAX; save(); }
  // Feri restocks the shop at midnight
  if(state.shopDay!==todayKey()){ const had=!!state.shopDay; state.shopDay=todayKey(); if(had){ state.shop=genShop(); if(view==='bolt'&&!battle&&!force){ render(); toast('Feri éjfélkor kipakolt egy új adagot.'); } } save(); }
  const en=$('#en'); if(en) en.textContent=state.energy;
  const ready = state.active ? state.active.endsAt<=t : null;
  if(!force && ready!==lastReady && !battle){ if(ready===true&&lastReady===false) sfx('arrive'); lastReady=ready; render(); return; }
  lastReady=ready;
  if(state.active && !ready){ const left=state.active.endsAt-t, qt=$('#qtime'), qp=$('#qprog'); if(qt) qt.textContent=fmtTime(left); if(qp) qp.style.width=(1-left/((state.active.dur||state.active.q.dur)*1000))*100+'%'; }
  const aLeft=Math.max(0,state.arenaReadyAt-t), aReady=aLeft===0;
  const acd=$('#acd'); if(acd) acd.textContent=aLeft?fmtTime(aLeft):'Most';
  if(view==='terkep'){ const mq=$('#m-q'), ma=$('#m-a'), md=$('#m-d');
    if(mq&&state.active) mq.textContent=fmtTime(Math.max(0,state.active.endsAt-t)); if(ma) ma.textContent=fmtTime(aLeft);
    if(md) md.textContent=fmtTime(Math.max(0,(state.dungeonReadyAt||0)-t));
    const sig=[!!(state.active&&state.active.endsAt<=t), aLeft===0, (state.dungeonReadyAt||0)<=t].join();
    if(!force && !battle && mapSig!==null && sig!==mapSig){ mapSig=sig; render(); return; } mapSig=sig; }
  if(!force && view==='arena' && aReady!==lastArenaReady && !battle){ lastArenaReady=aReady; render(); return; }
  lastArenaReady=aReady;
  const dLeft=Math.max(0,(state.dungeonReadyAt||0)-t), dReady=dLeft===0, dcd=$('#dcd');
  if(dcd) dcd.textContent=dLeft?fmtTime(dLeft):'Most';
  if(!force && view==='kazamata' && dReady!==lastDungReady && !battle){ lastDungReady=dReady; render(); return; }
  lastDungReady=dReady;
  const gLeft=state.guild?Math.max(0,state.guild.readyAt-t):0, gReady=gLeft===0, gcd=$('#gcd');
  if(gcd) gcd.textContent=gLeft?fmtTime(gLeft):'Most';
  if(!force && view==='ceh' && guildTab==='harc' && gReady!==lastGuildReady && !battle){ lastGuildReady=gReady; render(); return; }
  lastGuildReady=gReady;
  if(view==='kocsma' && !state.active) document.querySelectorAll('.quest-go').forEach(b=>{ const c=+b.dataset.cost; if(b.disabled!==(state.energy<c)){ b.disabled=state.energy<c; render(); } });
}
let toastT;
function toast(msg){ document.querySelector('.toast')?.remove(); const d=document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); clearTimeout(toastT); toastT=setTimeout(()=>d.remove(),2600); }
boot();
</script>
</body>
