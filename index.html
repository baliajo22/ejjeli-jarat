<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13141f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Éjjeli Járat">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Éjjeli Járat</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column — sticky HUD on top, tab bar at the bottom, illustrated scenes of the city at night in between */
:root{
  --night:#13141f; --concrete:#1d1f30; --panel:#272a42; --line:#393d5c;
  --text:#ece7da; --muted:#9a9bb4;
  --sodium:#f2a33a; --sodium-ink:#1b1206;
  --hex:#9d8bff; --ok:#5fc48b; --bad:#ec6552; --gold:#f2c230; --teal:#5fc4b4;
  --r-common:#c9c6bb; --r-uncommon:#5fd17a; --r-rare:#63b0ff; --r-epic:#d48cff; --r-special:#ffb454;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(120% 60% at 50% -10%, rgba(242,163,58,.13), transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--concrete)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:6px}

/* icons */
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.ic-gold{color:var(--gold)} .ic-coffee{color:#d9a06b} .ic-xp{color:var(--hex)} .ic-time{color:var(--muted)}
.ic-item{color:var(--r-rare)} .ic-hp{color:var(--bad)} .ic-armor{color:var(--teal)} .ic-crit{color:var(--sodium)}
.ic-str{color:#ec8a52} .ic-dex{color:var(--gold)} .ic-int{color:var(--hex)} .ic-con{color:var(--bad)} .ic-lck{color:var(--ok)}
.ic-fame{color:var(--gold)}
.with-ic{display:inline-flex;align-items:center;gap:5px}

/* art frames */
.banner{margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:360/140;max-width:100%;background:#1b1d33}
.banner svg{display:block;width:100%;height:100%}
.port{flex:none;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#3c4066,#1d1f30 78%);box-shadow:inset 0 0 0 1px var(--line)}
.port svg{display:block;width:100%;height:100%}
.itile{--rc:var(--r-common);flex:none;width:52px;height:52px;border-radius:10px;
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--rc) 30%,transparent),var(--panel) 72%);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc) 55%,transparent)}
.itile svg{display:block;width:100%;height:100%;padding:5px}
.itile.t1{--rc:var(--r-uncommon)} .itile.t2{--rc:var(--r-rare)} .itile.t3{--rc:var(--r-epic)}
.itile.t4{--rc:var(--r-special);position:relative;overflow:hidden;box-shadow:inset 0 0 0 2px var(--r-special),0 0 12px rgba(255,180,84,.45)}
.itile.t4::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,236,190,.45) 50%,transparent 65%);background-size:250% 100%;animation:shine 2.6s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{background-position:130% 0}60%,100%{background-position:-30% 0}}
.itile.empty{background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:var(--line)}
.itile.empty svg{width:60%;height:60%;padding:0}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--concrete);border-bottom:1px solid var(--line);padding-block:10px}
.hud-row{display:flex;align-items:center;gap:12px}
.plate{flex:none;width:44px;height:44px;background:var(--sodium);color:var(--sodium-ink);border-radius:6px;display:grid;place-items:center;align-content:center;font-family:var(--f-display);font-weight:900;font-size:19px;line-height:1;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.plate small{display:block;font-size:7.5px;font-weight:700;letter-spacing:.1em;margin-top:2px}
.hud-port{width:44px;height:44px}
.hud-name{min-width:0;flex:1}
.hud-name b{display:block;font-family:var(--f-display);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:var(--panel);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--hex);transition:width .3s}
.bar.hp i{background:var(--ok)}
.chips{display:flex;gap:6px;flex:none;flex-direction:column;align-items:flex-end}
.chip-row{display:flex;gap:6px}
.auth-err{margin:0;color:var(--sodium);font-size:13px}
.remember{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.remember input{width:18px;height:18px;accent-color:var(--sodium)}
.acct{margin-top:-6px}
.acct .note{display:inline-flex;align-items:center;gap:6px}
.nm.stat-more{cursor:help}
.nm.stat-more b{text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.nm.stat-more small{display:flex;margin-top:2px;color:var(--muted)}
.nm.stat-more:hover small{color:var(--text)}
.chip.loot{cursor:help;box-shadow:inset 0 0 0 1px var(--line)}
.chip.loot:hover{box-shadow:inset 0 0 0 1px var(--sodium)}
.chip.snd{border:0;padding:3px 8px;color:var(--muted);cursor:pointer}
.chip.snd:hover{color:var(--text)}
.btn.free-btn{animation:pulse 1.4s ease-in-out infinite}
.item.veh .btn{flex-wrap:wrap;max-width:132px;text-align:center;row-gap:2px}
.pog-line{display:inline-flex;align-items:center;gap:3px;width:100%;justify-content:center}
.pog-chip{color:#f6d590}
.pog-ic{width:1.25em;height:1.25em}
.btn.pog-btn{background:#3a2f1c;color:#f6d590;box-shadow:inset 0 0 0 1px rgba(242,194,107,.45)}
.btn.pog-btn:hover{filter:brightness(1.25)}
.chip{background:var(--panel);border-radius:999px;padding:3px 10px 3px 7px;font-family:var(--f-mono);font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}

/* main */
main{flex:1;padding-block:16px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.scene{display:flex;flex-direction:column;gap:6px}
.scene h2{font-size:22px}
.scene p{margin:0;color:var(--muted);max-width:60ch}
.card{background:var(--concrete);border:1px solid var(--line);border-radius:10px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}

/* quests */
.quest{display:grid;grid-template-columns:64px 1fr;gap:4px 12px;text-align:left;width:100%;background:var(--concrete);border:1px solid var(--line);border-radius:10px;padding:12px;transition:border-color .15s,transform .15s}
.quest:hover{border-color:var(--sodium)}
.quest:active{transform:scale(.99)}
.quest .port{width:64px;height:64px;grid-row:span 3}
.quest>*{min-width:0}
.quest .where{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.district{font-family:var(--f-mono);font-weight:700;color:var(--sodium);border:1px solid currentColor;border-radius:4px;padding:0 5px;font-size:11px;display:inline-flex;align-items:center;gap:3px}
.quest h3{font-size:15px}
.quest p{margin:0;color:var(--muted);font-size:14px}
.quest .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-mono);font-size:12.5px;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.diff{font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.diff-0{background:rgba(95,196,139,.15);color:var(--ok)}
.diff-1{background:rgba(242,163,58,.15);color:var(--sodium)}
.diff-2{background:rgba(236,101,82,.16);color:var(--bad)}
.quest{cursor:pointer}
.quest.busy{opacity:.6}
.quest.sel{border-color:var(--sodium);box-shadow:0 0 0 3px rgba(242,163,58,.18);background:linear-gradient(180deg,rgba(242,163,58,.07),transparent 60%),var(--concrete)}
.q-rewards{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rw{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:500}
.rw b{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.rw .ic{width:18px;height:18px}
.rw-gold{background:rgba(242,194,48,.14);color:var(--gold)}
.rw-xp{background:rgba(157,139,255,.16);color:var(--hex)}
.rw-item{background:rgba(99,176,255,.15);color:var(--r-rare)}
.rw-pog{background:#3a2f1c;color:#f6d590}
.rw-spec{background:rgba(255,180,84,.14);color:var(--r-special)}
.item.shop-it{grid-template-columns:52px 1fr auto;row-gap:8px}
.sc-row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.sc{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:4px 9px;font-size:12.5px;background:var(--panel);color:var(--text)}
.sc b{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.sc .ic{width:16px;height:16px}
.sc i{font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:700;margin-left:2px}
.sc i.up{color:var(--ok)} .sc i.down{color:var(--bad)}
.sc-dmg .ic{color:var(--sodium)} .sc-arm .ic{color:var(--teal)}
.sc-str .ic{color:#ec8a52} .sc-dex .ic{color:var(--gold)} .sc-int .ic{color:var(--hex)} .sc-con .ic{color:var(--bad)} .sc-lck .ic{color:var(--ok)}
.sc-lost{opacity:.55}
.dung-next .q-rewards{grid-column:1/-1;margin-top:4px}
.q-cost{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:8px;margin-top:2px;border-top:1px dashed var(--line)}
.q-go{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;margin-top:6px;animation:in .2s}
.q-go .btn{width:100%;padding:13px;font-size:15px}

.active{border-color:var(--sodium);background:linear-gradient(180deg,rgba(242,163,58,.08),transparent 70%),var(--concrete)}
.active-top{display:flex;gap:14px;align-items:center}
.active-top .port{width:88px;height:88px}
.timer{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.bigbar{height:10px;background:var(--panel);border-radius:5px;overflow:hidden}
.bigbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--sodium) 0 10px,#e08f22 10px 20px);transition:width .25s linear}

.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;background:var(--panel);transition:filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--sodium);color:var(--sodium-ink)}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.note{font-size:12px;color:var(--muted)}

/* character */
.hero{display:flex;gap:14px;align-items:center}
.hero .port{width:96px;height:96px}
.derived{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.derived div{background:var(--panel);border-radius:8px;padding:8px 4px;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.derived .ic{width:18px;height:18px}
.derived b{font-family:var(--f-mono);font-size:15px}
.derived span{font-size:11px;color:var(--muted)}
.stat{display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat-ic{width:34px;height:34px;border-radius:8px;background:var(--panel);display:grid;place-items:center}
.stat-ic .ic{width:20px;height:20px}
.stat .v{font-family:var(--f-mono);font-size:17px;font-weight:700;min-width:3ch;text-align:right}
.stat .v small{color:var(--ok);font-size:12px;margin-left:3px}
.stat.main .nm>b::after{content:"fő";margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--sodium-ink);background:var(--sodium);border-radius:3px;padding:0 4px;vertical-align:2px}
.nm{min-width:0}
.nm b{font-weight:500}
.nm small{display:block;color:var(--muted);font-size:12px}
.eff{display:flex;flex-direction:column;font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.eff .vals{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px}
.eff b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--text);font-weight:700}
.eff-next{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ok);font-weight:700}

.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.slot{background:var(--panel);border-radius:8px;padding:8px;min-width:0;display:flex;gap:10px;align-items:center}
.slot>div:last-child{min-width:0}
.slot .itile{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--rc) 30%,transparent),var(--concrete) 72%)}
.item-name{font-weight:700;font-size:14px}
.r0{color:var(--r-common)} .r1{color:var(--r-uncommon)} .r2{color:var(--r-rare)} .r3{color:var(--r-epic)} .item-name.r4,.r4{color:var(--r-special)}
.item-stats{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 10px}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item>div{min-width:0}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cmp-up{color:var(--ok)} .cmp-down{color:var(--bad)}
.doll{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}
.doll-col{display:flex;flex-direction:column;gap:10px}
.dslot{display:flex;flex-direction:column;align-items:center;gap:3px}
.dslot[data-tip]{cursor:help}
.dslot .itile{width:56px;height:56px;transition:transform .15s}
.dslot[data-tip]:hover .itile{transform:translateY(-2px)}
.dslot-l{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.doll-center{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.doll-center h2{font-size:19px}
.port.doll-port .worn{filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.port.doll-port{width:min(100%,230px);height:auto;aspect-ratio:1;border-radius:16px;background:radial-gradient(circle at 50% 28%,#4a4f7c,#1d1f30 72%);box-shadow:inset 0 0 0 1px var(--line),0 10px 24px rgba(0,0,0,.35)}
.wslot{display:flex;gap:10px;align-items:center;background:var(--panel);border-radius:10px;padding:8px;width:100%;text-align:left}
.wslot[data-tip]{cursor:help}
.wslot>div:last-child{min-width:0}
.tip.wide{width:min(500px,calc(100vw - 24px))}
.tip-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tip-card{min-width:0;display:flex;flex-direction:column;gap:6px}
.tip-card.worn{padding-left:10px;border-left:1px dashed var(--line)}
.tip-tag{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--sodium)}
.tip-card.worn .tip-tag{color:var(--muted)}
.tip-card .tip-head{align-items:flex-start}
.tip-card .tip-head .itile{width:40px;height:40px;border-radius:8px}
.tip-card .tip-head .itile svg{padding:4px}
.tip-card .item-name{font-size:13px;line-height:1.25}
.tip-list .tip-row,.tip-card .tip-sec .tip-row{grid-template-columns:16px 1fr auto}
.tip-card .tip-sec{margin-top:4px;padding-top:6px}
[data-drag]{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.drag-h{flex:none}
.dragging,.dragging *{cursor:grabbing!important}
.drag-ghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.drag-ghost .itile{width:56px;height:56px}
.drop-ok .itile,.bag.drop-ok,.wslot.drop-ok{box-shadow:inset 0 0 0 2px var(--sodium),0 0 0 3px rgba(242,163,58,.25)!important}
.bag.drop-ok{background:linear-gradient(180deg,rgba(242,163,58,.07),transparent 60%),var(--concrete)}
.drop-hover .itile,.bag.drop-hover,.wslot.drop-hover{box-shadow:inset 0 0 0 3px var(--ok),0 0 0 5px rgba(95,196,139,.3)!important}
.drop-hover.dslot .itile{transform:scale(1.08)}
.veh-line.expired{color:var(--bad);border-color:rgba(236,101,82,.5)}
.item.veh.own{background:rgba(242,163,58,.06);border-radius:8px}
.own-tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--sodium);color:var(--sodium-ink);border-radius:3px;padding:0 4px;vertical-align:2px}
.item[data-tip]{cursor:help;border-radius:8px;transition:background .15s}
.item[data-tip]:hover{background:rgba(255,255,255,.03)}
.tip{position:fixed;left:0;top:0;z-index:25;width:min(300px,calc(100vw - 24px));background:#0e0f18;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 14px 36px rgba(0,0,0,.55);pointer-events:none;animation:in .15s}
.tip-head{display:flex;gap:10px;align-items:center}
.tip-head>div:last-child{min-width:0}
.tip-sec{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.tip-row{display:grid;grid-template-columns:18px 1fr auto auto;gap:8px;align-items:center;font-size:13px;padding-block:3px}
.tip-row .ic{width:16px;height:16px}
.tip-row b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.d{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;text-align:right;min-width:4ch}
.d.up{color:var(--ok)} .d.down{color:var(--bad)} .d.eq{color:var(--muted)}
.tip-foot{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.tip-foot .itile{width:28px;height:28px;border-radius:7px}
.tip-foot .itile svg{padding:3px}

/* arena */
.opp{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.opp:last-child{border-bottom:0}
.opp .port{width:56px;height:56px}
.opp>div{min-width:0}

/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--concrete);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab .lock-mini{position:absolute;top:6px;right:calc(50% - 20px);color:var(--muted)}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,10,18,.86);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:100%;overflow-y:auto;background:var(--concrete);border-top:2px solid var(--sodium);border-radius:16px 16px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.versus{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.fighter{min-width:0;display:flex;flex-direction:column;gap:4px}
.fighter .port{width:84px;height:84px}
.fighter.right{text-align:right;align-items:flex-end}
.fighter.right .bar{width:100%}
.fighter b{display:block;font-family:var(--f-display);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fighter .hpnum{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.vs{font-family:var(--f-display);font-weight:900;color:var(--sodium);font-size:14px;padding-bottom:30px}
.fighter.right .bar i{margin-left:auto}
.sheet,.versus{position:relative}
.pw{position:relative}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--f-display);font-weight:900;font-size:18px;white-space:nowrap;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.7);pointer-events:none;z-index:4}
.float.dmg{color:var(--bad)} .float.crit{color:var(--gold);font-size:23px} .float.dodge{color:var(--teal)} .float.miss{color:var(--muted)} .float.block{color:#9ec0f0}
.fx-slash{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);z-index:3;overflow:visible;pointer-events:none}
.fx-shield{position:absolute;inset:6%;z-index:3;pointer-events:none}
.fx-shield svg{width:100%;height:100%}
.wpn{position:absolute;left:0;top:0;z-index:6;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.55));transform-origin:50% 80%}
.wpn svg{width:100%;height:100%;display:block}
.wpn.glow{filter:drop-shadow(0 0 10px var(--hex)) drop-shadow(0 0 4px #fff)}
.bolt.shot{width:14px;height:14px;background:radial-gradient(circle,#fff 0 25%,var(--sodium) 50%,transparent 72%);box-shadow:0 0 10px var(--sodium)}
.bolt{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,var(--hex) 45%,transparent 70%);box-shadow:0 0 16px var(--hex);z-index:5;pointer-events:none}
.port.ko{filter:grayscale(1) brightness(.55);transform:rotate(-8deg) translateY(6px);transition:filter .5s,transform .5s}
.fighter.right .port.ko{transform:rotate(8deg) translateY(6px)}
.ko-stamp{position:absolute;left:42px;top:42px;transform:translate(-50%,-50%) rotate(-12deg);font-family:var(--f-display);font-weight:900;font-size:20px;color:var(--bad);border:3px solid var(--bad);border-radius:6px;padding:0 6px;background:rgba(19,20,31,.75);animation:stamp .35s cubic-bezier(.3,1.6,.5,1) both;z-index:4}
.fighter.right .ko-stamp{left:auto;right:42px;transform:translate(50%,-50%) rotate(12deg);animation-name:stamp-r}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);opacity:0}}
@keyframes stamp-r{from{transform:translate(50%,-50%) rotate(12deg) scale(2.4);opacity:0}}
.port.win{animation:bounce .6s ease 2}
@keyframes bounce{40%{transform:translateY(-10px) scale(1.06)}}
.result{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.rewards>*{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.rewards>*:nth-child(2){animation-delay:.12s}.rewards>*:nth-child(3){animation-delay:.24s}.rewards>*:nth-child(4){animation-delay:.36s}
.coin-burst{position:absolute;left:0;top:0;width:18px;height:18px;color:var(--gold);pointer-events:none;z-index:6}
.coin-burst .ic{width:18px;height:18px}
.active.depart{animation:depart .45s ease-out}
@keyframes depart{from{transform:translateY(-12px);opacity:0}}
.active.depart .port{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
.active.arrived{animation:arrive 1.2s ease-out}
@keyframes arrive{0%{box-shadow:0 0 0 0 rgba(242,163,58,.7)}100%{box-shadow:0 0 0 18px rgba(242,163,58,0)}}
.active.arrived .timer{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;color:var(--sodium)}
.active.arrived .port{animation:menace .9s ease-in-out infinite}
@keyframes menace{50%{transform:scale(1.06)}}
.btn.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(242,163,58,.28)}}
.plate.lvlup{animation:lvl 1s ease 2}
.lv-overlay{align-items:center;padding:12px}
.lv-card{position:relative;overflow:hidden;width:min(420px,100%);max-height:100%;overflow-y:auto;background:radial-gradient(120% 60% at 50% 0%,rgba(242,163,58,.16),transparent 60%),var(--concrete);border:2px solid var(--sodium);border-radius:18px;padding:22px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.lv-burst{position:relative;width:150px;height:150px;display:grid;place-items:center;flex:none}
.lv-rays{position:absolute;inset:-34px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(242,163,58,.32) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.plate.lv-plate{display:block;position:relative;overflow:hidden;width:96px;height:96px;border-radius:14px;font-size:46px;box-shadow:0 0 34px rgba(242,163,58,.65),inset 0 0 0 3px rgba(0,0,0,.25);animation:lvShake .4s .45s ease both}
.lv-plate .lv-old,.lv-plate .lv-new{position:absolute;left:0;right:0;top:18px;line-height:1}
.lv-plate small{position:absolute;left:0;right:0;bottom:12px;font-size:10px;margin:0}
.lv-old{animation:lvOut .45s .55s ease-in both}
.lv-new{animation:lvIn .55s .95s cubic-bezier(.3,1.6,.5,1) both}
@keyframes lvOut{to{transform:translateY(-70px);opacity:0}}
@keyframes lvIn{from{transform:translateY(70px) scale(.5);opacity:0}}
@keyframes lvShake{30%{transform:rotate(-6deg) scale(1.08)}60%{transform:rotate(5deg) scale(1.12)}}
.lv-title{font-size:28px;font-weight:900;color:var(--sodium);animation:pop .5s 1.15s cubic-bezier(.3,1.6,.5,1) both}
.lv-sub{margin:0;animation:pop .4s 1.25s ease both}
.lv-list{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left;margin-top:4px}
.lv-row{display:grid;grid-template-columns:20px 1fr auto auto;gap:8px;align-items:center;background:var(--panel);border-radius:8px;padding:8px 10px;font-size:13.5px;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.lv-row>span:nth-child(2){min-width:0}
.lv-row b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lv-row:nth-child(1){animation-delay:1.4s}.lv-row:nth-child(2){animation-delay:1.52s}.lv-row:nth-child(3){animation-delay:1.64s}.lv-row:nth-child(4){animation-delay:1.76s}.lv-row:nth-child(5){animation-delay:1.88s}.lv-row:nth-child(6){animation-delay:2s}.lv-row:nth-child(7){animation-delay:2.1s}
.lv-unlock{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px;border-radius:10px;background:linear-gradient(135deg,rgba(157,139,255,.22),rgba(157,139,255,.05));box-shadow:inset 0 0 0 1px var(--hex),0 0 18px rgba(157,139,255,.25);animation:pop .45s 2.05s cubic-bezier(.3,1.6,.5,1) both}
.lv-unlock .port{width:52px;height:52px}
.lv-unlock>div{min-width:0}
.lv-unlock .label{color:var(--hex)}
.lv-unlock-name{font-family:var(--f-display);font-size:14px;font-weight:700}
.lv-tip{width:100%;display:flex;gap:8px;align-items:flex-start;text-align:left;font-size:13px;background:rgba(242,163,58,.1);border-radius:10px;padding:9px 11px;animation:pop .4s 1.9s ease both}
.lv-tip .ic{color:var(--sodium);margin-top:2px}
.lv-note{margin:2px 0 0;animation:pop .4s 2.12s ease both}
.lv-btn{width:100%;animation:pop .4s 2.22s ease both}
@media (prefers-reduced-motion:reduce){.lv-old{display:none}}
@keyframes lvl{30%{transform:scale(1.25) rotate(-6deg);box-shadow:0 0 18px var(--sodium)}}
.blog{background:var(--night);border-radius:8px;padding:10px 12px;height:190px;overflow-y:auto;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.blog div{animation:in .2s}
.blog .me{color:var(--text)} .blog .them{color:var(--muted)}
.blog .crit{color:var(--sodium);font-weight:700}
.blog .dodge{font-style:italic}
@keyframes in{from{opacity:.2;transform:translateY(3px)}}
.result{font-family:var(--f-display);font-size:24px;font-weight:900}
.result.win{color:var(--ok)} .result.lose{color:var(--bad)}
.rewards{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sodium);color:var(--sodium-ink);font-weight:700;padding:10px 16px;border-radius:999px;z-index:30;max-width:calc(100% - 32px);text-align:center;animation:in .25s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.derived{grid-template-columns:repeat(2,1fr)}.hud-port{display:none}.slots{grid-template-columns:1fr}}

/* ===== Éjszakai neon réteg: mélyebb éjszaka, üveges sávok, fénylő kártyák ===== */
:root{
  --night:#0c0d17; --concrete:#191a2b; --panel:#24263d; --line:#34375a;
  --neon-a:#f2a33a; --neon-b:#ff4f8b; --neon-c:#7d6bff; --neon-d:#38d6c4;
  --surf:linear-gradient(180deg,#1f2135 0%,#17182a 100%);
  --edge:inset 0 1px 0 rgba(255,255,255,.06),0 10px 26px -12px rgba(0,0,0,.7);
}
body{background-color:var(--night);
  background-image:
    radial-gradient(90% 45% at 12% -8%,rgba(255,79,139,.16),transparent 60%),
    radial-gradient(90% 45% at 92% -6%,rgba(125,107,255,.18),transparent 62%),
    radial-gradient(120% 50% at 50% 112%,rgba(242,163,58,.12),transparent 60%),
    radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.35),transparent 1px),
    radial-gradient(1px 1px at 70% 18%,rgba(255,255,255,.28),transparent 1px),
    radial-gradient(1px 1px at 84% 62%,rgba(255,255,255,.22),transparent 1px),
    radial-gradient(1px 1px at 35% 78%,rgba(255,255,255,.2),transparent 1px);
  background-attachment:fixed}
body::before{background:rgba(12,13,23,.86)}

/* felső sáv: üveg, neon csík alul */
.hud{background:rgba(16,17,30,.78);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border-bottom:0;box-shadow:0 8px 24px -14px rgba(0,0,0,.9)}
.hud::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--neon-b) 18%,var(--neon-a) 50%,var(--neon-c) 82%,transparent);opacity:.75;filter:drop-shadow(0 0 6px rgba(255,79,139,.6))}
.plate{background:linear-gradient(160deg,#ffc56a,#f2a33a 55%,#d9811f);border-radius:10px;box-shadow:0 0 0 1px rgba(255,214,150,.55) inset,0 0 16px rgba(242,163,58,.45),0 4px 10px rgba(0,0,0,.4)}
.hud-name b{text-shadow:0 0 12px rgba(255,255,255,.12)}
.hud .bar{height:7px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.hud .bar i{background:linear-gradient(90deg,var(--neon-c),#b8a9ff);box-shadow:0 0 10px rgba(125,107,255,.8)}
.chip{background:rgba(255,255,255,.055);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.chip.pog-chip{background:rgba(242,194,107,.1);box-shadow:inset 0 0 0 1px rgba(242,194,107,.3)}

/* alsó menü: lebegő üvegsáv, a kiválasztott fül világít */
.tabs{left:0;right:0;bottom:0;background:none;border-top:0;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs .in{pointer-events:auto;background:rgba(18,19,33,.82);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-radius:20px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.08),0 12px 30px -8px rgba(0,0,0,.85);padding:5px}
.tab{padding:8px 1px 7px;border-radius:14px;transition:color .2s,background .2s}
.tab svg{transition:transform .2s,filter .2s}
.tab[aria-current="page"]{color:#ffd08a;background:radial-gradient(80% 90% at 50% 30%,rgba(242,163,58,.28),rgba(242,163,58,.06) 70%);box-shadow:inset 0 0 0 1px rgba(242,163,58,.35)}
.tab[aria-current="page"] svg{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 0 6px rgba(242,163,58,.9))}
.tab[aria-current="page"]::before{top:auto;bottom:3px;left:40%;right:40%;height:2px;border-radius:2px;box-shadow:0 0 8px var(--sodium)}
.tab:not([aria-current]):active{background:rgba(255,255,255,.05)}
.tab .dot{top:5px;box-shadow:0 0 0 2px rgba(18,19,33,.9),0 0 8px var(--bad)}

/* kártyák és dobozok */
.card,.quest,.ros,.cls{background:var(--surf);border:1px solid rgba(120,126,190,.18);border-radius:14px;box-shadow:var(--edge)}
.card{position:relative}
.card::before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);pointer-events:none}
.card>.row:first-child .label,.card>.label:first-child{color:#c9c4e8}
.card>.row:first-child .label .ic,.card>.label:first-child .ic{color:var(--sodium);filter:drop-shadow(0 0 4px rgba(242,163,58,.6))}
.quest{transition:border-color .2s,transform .15s,box-shadow .2s}
.quest:hover{border-color:rgba(242,163,58,.6);box-shadow:var(--edge),0 0 0 1px rgba(242,163,58,.25),0 0 22px -6px rgba(242,163,58,.45)}
.banner{border:1px solid rgba(120,126,190,.22);border-radius:16px;box-shadow:0 14px 34px -14px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.03) inset}
.port{box-shadow:inset 0 0 0 1px rgba(150,156,220,.25),0 4px 12px -6px rgba(0,0,0,.8)}
.seg{background:rgba(20,21,36,.7);border:1px solid rgba(120,126,190,.18);border-radius:14px;box-shadow:var(--edge)}
.seg button{border-radius:10px;transition:background .2s,color .2s}
.seg button[aria-selected="true"]{background:linear-gradient(160deg,#ffc56a,#f2a33a 60%,#e08a25);box-shadow:0 0 14px -2px rgba(242,163,58,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.scene h2{text-shadow:0 0 18px rgba(125,107,255,.25)}
.scene .label{color:#b8b3dc}

/* gombok: fényesebb fő gomb */
.btn{border-radius:10px}
.btn.primary{background:linear-gradient(160deg,#ffc56a,#f2a33a 55%,#df8722);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px -6px rgba(242,163,58,.7)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary:disabled{box-shadow:none}
.field input{background:rgba(10,11,20,.6);border-color:rgba(120,126,190,.25);border-radius:10px}
.field input:focus{border-color:var(--sodium);box-shadow:0 0 0 3px rgba(242,163,58,.18)}
.sheet,.ins-card{background:linear-gradient(180deg,#1e2034,#151626)}
.quest{position:relative;overflow:hidden}
.quest::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--qc,var(--ok));box-shadow:0 0 10px var(--qc,var(--ok))}
.quest:has(.diff-1){--qc:var(--sodium)} .quest:has(.diff-2){--qc:var(--bad)}
.quest.sel{border-color:rgba(242,163,58,.55);box-shadow:var(--edge),0 0 24px -8px rgba(242,163,58,.55)}
@media (prefers-reduced-transparency:reduce){.hud,.tabs .in{background:#14152a;-webkit-backdrop-filter:none;backdrop-filter:none}}

/* ===== háttérképek: oldal, út, harc ===== */
#viewbg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .5s}
#viewbg.on{opacity:1}
#viewbg svg{width:100%;height:100%;display:block}
#viewbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,13,23,.15),rgba(12,13,23,.55) 45%,rgba(12,13,23,.8))}
.app{position:relative;z-index:1}
.journey{display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--surf);border:1px solid rgba(120,126,190,.2);box-shadow:var(--edge),0 18px 40px -20px rgba(0,0,0,.9)}
.j-scene{position:relative;aspect-ratio:360/230;overflow:hidden}
.j-scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.journey.onway .j-scene>svg{animation:jpan 26s ease-in-out infinite alternate}
@keyframes jpan{from{transform:scale(1.08) translateX(-2.5%)}to{transform:scale(1.08) translateX(2.5%)}}
.j-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,13,23,.35),transparent 30%,transparent 60%,rgba(23,24,42,.95))}
.j-tags{position:absolute;left:12px;top:12px;display:flex;gap:6px}
.j-tags .district,.j-tags .diff{background:rgba(10,11,20,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.j-foe{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .5s,opacity .5s,filter .5s}
.j-foe .port{width:72px;height:72px;border-radius:14px;box-shadow:0 0 0 2px rgba(255,90,78,.6),0 0 24px rgba(255,90,78,.45)}
.j-foe span{font-size:11px;font-weight:800;background:rgba(10,11,20,.75);padding:2px 8px;border-radius:999px}
.journey.onway .j-foe{opacity:.55;filter:brightness(.35) blur(1px);transform:scale(.85)}
.journey.arrived .j-foe{animation:foein .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes foein{from{transform:scale(.5) translateY(20px);opacity:0}}
.j-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.j-body h2{font-size:21px}
.j-body p{margin:0}
.j-track{position:relative;padding:14px 18px 2px 0}
.j-track .bigbar{height:8px}
.j-me{position:absolute;top:0;transform:translateX(-50%);transition:left 1s linear}
.j-me .port{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 2px var(--sodium),0 0 12px rgba(242,163,58,.7)}
.journey.onway .j-me .port{animation:walk .5s ease-in-out infinite alternate}
@keyframes walk{to{transform:translateY(-3px)}}
.j-flag{position:absolute;right:0;top:12px;color:var(--bad)}
.journey .timer{font-family:var(--f-mono);font-size:26px;font-weight:700}
.chip.mini{font-size:11.5px;padding:2px 8px 2px 6px}
.btn.big{padding:15px;font-size:16px}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.sheet.has-bg{position:relative;isolation:isolate}
.b-bg{position:absolute;left:0;right:0;top:0;height:270px;z-index:-1;overflow:hidden;border-radius:16px 16px 0 0;-webkit-mask-image:linear-gradient(#000 50%,transparent);mask-image:linear-gradient(#000 50%,transparent)}
.b-bg svg{width:100%;height:100%;display:block}
.b-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,13,23,.35),rgba(12,13,23,.7))}
.has-bg .fighter b,.has-bg .gw-names b{text-shadow:0 1px 6px rgba(0,0,0,.9)}
.has-bg .blog{background:rgba(8,9,16,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media (prefers-reduced-motion:reduce){.journey .j-scene>svg,.j-me .port{animation:none}}

/* ===== jutalom-buborékok: fényes kapszulák, ikon kis érmében ===== */
.rw{--c:var(--gold);position:relative;border-radius:999px;padding:3px 12px 3px 3px;gap:7px;font-weight:600;color:var(--c);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,#1a1b2c),color-mix(in srgb,var(--c) 9%,#14152a));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.12),0 4px 12px -6px color-mix(in srgb,var(--c) 70%,transparent)}
.rw::after{content:"";position:absolute;left:14px;right:14px;top:1px;height:40%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent);pointer-events:none}
.rw>.ic,.rw>.pog-ic,.rw>svg:first-child{width:24px;height:24px;padding:4px;border-radius:50%;flex:none;color:var(--c);
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#fff 10%),color-mix(in srgb,var(--c) 22%,#0c0d17) 75%);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent),0 0 8px color-mix(in srgb,var(--c) 45%,transparent)}
.rw>.ic{color:#fff}
.rw b{color:color-mix(in srgb,var(--c) 70%,#fff);text-shadow:0 0 10px color-mix(in srgb,var(--c) 50%,transparent)}
.rw-gold{--c:#f2c230} .rw-xp{--c:#9d8bff} .rw-item{--c:#63b0ff} .rw-pog{--c:#f2b86b} .rw-spec{--c:#ffb454}
.rw-pog,.rw-xp,.rw-gold,.rw-item,.rw-spec{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,#1a1b2c),color-mix(in srgb,var(--c) 9%,#14152a))}
.quest:hover .rw,.journey .rw{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 50%,transparent),inset 0 1px 0 rgba(255,255,255,.14),0 4px 14px -5px color-mix(in srgb,var(--c) 80%,transparent)}
.chip.mini.rw,.journey .rw{font-size:12px;padding:2px 10px 2px 2px}
.journey .rw>.ic,.journey .rw>.pog-ic,.journey .rw>svg:first-child{width:20px;height:20px;padding:3px}
.journey .rw b{font-size:13.5px}
/* helyszín és nehézség címkék */
.district{border:0;border-radius:999px;padding:2px 8px;background:rgba(242,163,58,.12);box-shadow:inset 0 0 0 1px rgba(242,163,58,.45)}
.diff{border-radius:999px;padding:2px 9px;box-shadow:inset 0 0 0 1px currentColor}
.diff-0{background:rgba(95,196,139,.14)} .diff-1{background:rgba(242,163,58,.14)} .diff-2{background:rgba(236,101,82,.16);text-shadow:0 0 8px rgba(236,101,82,.6)}
/* általános chipek (harc utáni jutalmak, felső sáv) */
.chip{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.08)}
.chip>.ic:first-child{filter:drop-shadow(0 0 4px currentColor)}
</style>
</head>

function scnStars(seed,n=26,ymax=90){ const r=seeded(seed); let o=''; for(let i=0;i<n;i++) o+=`<circle cx="${(r()*360).toFixed(1)}" cy="${(r()*ymax).toFixed(1)}" r="${(r()*1.1+.3).toFixed(2)}" fill="#fff" opacity="${(r()*.5+.25).toFixed(2)}"/>`; return o; }

const RENT_MS=7*24*3600*1000;
function activeVeh(){ const r=state.vehicle; if(!r||!r.id||r.until<=now()) return null; return VEHICLES.find(x=>x.id===r.id)||null; }
function fmtLeft(ms){ const m=Math.max(1,Math.floor(ms/60000)), d=Math.floor(m/1440), h=Math.floor(m%1440/60); return d?`${d} nap ${h} óra`:h?`${h} óra ${m%60} perc`:`${m} perc`; }
function mountRed(){ const v=activeVeh(); return v?v.red:0; }
function effDur(q){ return Math.max(3,Math.round(q.dur*(1-mountRed()))); }
function qCost(q){ const v=activeVeh(), d=v&&v.coffee?effDur(q):q.dur; return Math.max(1,Math.round((Math.round(d*.8)+5)*.24)); }
/* double espresso: pogácsa only, +30 coffee, max 10 per day */
const ESPRESSO_GAIN=30, ESPRESSO_DAILY=10;
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function espressoLeft(){ return state.coffeeDay===todayKey()?Math.max(0,ESPRESSO_DAILY-(state.coffeeCount||0)):ESPRESSO_DAILY; }
function canEspresso(){ return espressoLeft()>0&&(state.pog||0)>=1&&state.energy<ENERGY_MAX; }

// dungeon foes pay roughly 1.6× a quest of the same level, always drop an item (20% special), the boss always drops a special one
// a newer dungeon never starts easier than the previous one's 8th floor
function floorPower(d,fl){
  const boss=fl===9; let lvl=d.base+Math.floor(fl*.6), mult=(boss?1.18:Math.max(.84+fl*.03,.68+fl*.05))*1.1;
  const i=DUNGEONS.indexOf(d);
  if(i>0&&!boss){ const p=floorPower(DUNGEONS[i-1],7), start=p.mult*.86, top=(Math.max(.84+8*.03,.68+8*.05))*1.1; mult=Math.max(mult,start+(top-start)*Math.min(fl,8)/8); }
  return {lvl,mult};
}
// dungeons are a real step up from tavern quests: tougher foes, bigger pay
const DUNG_HARD=1.3, DUNG_PAY=1.6;
// high-level enemies outscale players faster, so later dungeons ease off a little to keep the same curve; dawn stays steeper
function dungTune(d){ const l=d.unlock; return d.dawn?.93:(l<=15?1:Math.max(.9,1-(l-15)*.1/30)); }
function dungeonFoe(d,fl){ const boss=fl===9, p=floorPower(d,fl), lvl=p.lvl, mult=p.mult*DUNG_HARD*dungTune(d); return {level:lvl, boss, cls:Object.keys(CLASSES)[(fl+d.unlock)%Object.keys(CLASSES).length], mult, gold:Math.round((20+lvl*14)*(boss?3:1)*DUNG_PAY*goldMult()), xp:Math.round((40+lvl*22)*(boss?2:1)*DUNG_PAY*xpMult())}; }

let REAL={};
function otherHeroes(){ return state?listChars().filter(c=>c.cid&&c.cid!==state.cid):[]; }
function syncLadder(){
  if(!state||!state.ladder) return;
  const others=otherHeroes(); REAL=Object.fromEntries(others.map(c=>[c.cid,c]));
  const L=state.ladder;
  for(let i=L.length-1;i>=0;i--) if(L[i].real&&!REAL[L[i].cid]) L.splice(i,1);

function genItem(lvl, slot, cls, force){
  slot = slot || pick(SLOTS)[0];
  const roll=Math.random(); const r = force!=null ? force : roll<.04?3:roll<.18?2:roll<.48?1:0;
  const base = slot==='fegyver' ? pick(WEAPONS[cls||state.cls]) : pick(GEAR[slot]);
  let name=pick(PREFIX[r])+' '+base.toLowerCase();
  const it={id:uid(),slot,rar:r,lvl,base,name,bonus:{},armor:0};
  // flatter curve: rarity adds ~10–15% per tier, more stats instead of huge numbers
  const RM_=[.8,1,1.15,1.4,1.7][r]; // grey is the cheap, weak tier
  if(slot==='fegyver'){ it.min=Math.round((lvl*1.6+2)*RM_); it.max=Math.round((lvl*2.4+4)*RM_)+rand(0,1); }
  else if(ARMOR_W[slot]){ it.armor=Math.round((lvl*ARMOR_W[slot]+2)*RM_)+rand(0,1); }
  const n = TRINKET.includes(slot) ? [1,1,2,2,3][r] : [1,1,1,2,3][r];
  const pool=STATS.map(x=>x[0]).sort(()=>Math.random()-.5);
  if(slot==='kabala'){ pool.splice(pool.indexOf('lck'),1); pool.unshift('lck'); }
  for(let i=0;i<n;i++) it.bonus[pool[i]]=Math.round((1.6+lvl*.7)*RM_)+rand(0,1);
  it.price = Math.round((18+lvl*14)*[.6,1,1.5,2.3,3.1][r]);
  return it;
}

  s.equip=s.equip||{}; for(const [k] of SLOTS) if(!(k in s.equip)) s.equip[k]=null;
  if(typeof s.vehicle==='string') s.vehicle={id:s.vehicle,until:now()+RENT_MS};
  if(!s.autoGain){ s.autoGain=true; lvlGain(s,(s.level||1)-1); }
  if(!s.rarV2){ s.rarV2=true; const up=it=>{ if(it&&it.rar>0) it.rar+=1; }; Object.values(s.equip||{}).forEach(up); (s.inv||[]).forEach(up); (s.shop||[]).forEach(up); }
  if(!s.ladder) s.ladder=genLadder(); s.dungeons=s.dungeons||{}; s.dungeonReadyAt=s.dungeonReadyAt||0; if(!('vehicle' in s)) s.vehicle=null; if(s.pog==null) s.pog=POG_START; if(!s.pogReset25){ s.pogReset25=true; if(s.pogTest5000||s.pog>POG_START) s.pog=POG_START; } if(!('guild' in s)) s.guild=null;
  Object.values(s.equip||{}).forEach(fix); (s.inv||[]).forEach(fix); (s.shop||[]).forEach(fix);

function resist(s,lvl){return Math.min(.5, s/(s+15+lvl*8))}
const PLURAL={kidobo:'kidobók',magus:'panelmágusok',futar:'tetőlövészek',zsebmetszo:'zsebmetszők'};
const pct=x=>(Math.round(x*1000)/10).toLocaleString('hu-HU')+'%';
function dmgRange(w,main){const c=CLASSES[state.cls], b=main*STAT_DMG; return `${c.hits>1?c.hits+'× ':''}${Math.round((w.min+b)*c.dmg)}–${Math.round((w.max+b)*c.dmg)}`}
function statEffects(k){
  const s=effStats(), lvl=state.level, c=CLASSES[state.cls], w=state.equip.fegyver||{min:1,max:3}, n=s[k]+1, out=[];
  const line=(label,a,b,extra='')=>`<span class="eff"><span>${label}</span><span class="vals"><b>${a}</b>${a===b?'':`<span class="eff-next">→ ${b}</span>`}${extra}</span></span>`;
  if(k===c.main) out.push(line('Sebzés',dmgRange(w,s[k]),dmgRange(w,n)));
  if(k==='con') out.push(line('Életerő',fmt(maxHp(s.con,lvl,state.cls))+' HP',fmt(maxHp(n,lvl,state.cls))+' HP'));
  if(k==='lck'){ const p=x=>pct(critChance({stats:{lck:x},level:lvl})); out.push(line('Krit esély',p(s.lck),p(n),'<span class="muted">(max 50%)</span>')); }
  const vs=Object.keys(CLASSES).filter(x=>CLASSES[x].main===k).map(x=>PLURAL[x]).join(' és ');
  if(vs) out.push(line(`Védelem ${vs} ellen`,pct(resist(s[k],lvl)),pct(resist(n,lvl)),'<span class="muted">(max 50%)</span>'));
  return out.join('');
}

function genQuests(){
  const used=new Set(), out=[];
  for(let d=0; d<3; d++){
    let q; do{ q=pick(QUESTS); }while(used.has(q[1])); used.add(q[1]);
    const lvl=state.level, dur=rand(8,24);
    out.push({id:uid(), district:q[0], title:q[1], desc:q[2], enemy:q[3], diff:d, mult:questMult(d,lvl), dur, cost:Math.round(dur*.8)+5,
      gold:Math.round((5+lvl*6+rand(0,lvl*3))*(.7+d*.45)), xp:Math.round((14+lvl*9)*(.7+d*.45)+dur*.6), drop:Math.random()<[.06,.12,.22][d], pog:Math.random()<POG_RATE.quest[d]});
  }
  return out.sort(()=>Math.random()-.5);
}

  state.shop=n; save(); SHOP_FX=true; render(); SHOP_FX=false; const c=$('#shoplist'); if(c&&c.getBoundingClientRect().top<0) c.scrollIntoView({behavior:'smooth',block:'start'}); }
function genShop(){ const l=state.level, others=SLOTS.map(s=>s[0]).filter(k=>k!=='fegyver').sort(()=>Math.random()-.5).slice(0,6); return [genItem(l,'fegyver'),genItem(l,'fegyver'),...others.map(k=>genItem(l,k))].map(shopPremium); }

function shopPremium(it){
  if(it.rar<2||it.rar>3) return it;
  const v=Math.random(); if(v<.4) return it;
  const p=v<.75?rand(1,4):rand(6,10);
  it.pog=p; it.price=Math.max(5,Math.round(it.price*(1-p*.06)));
  return it; }
function genArena(){
  syncLadder();
  const L=state.ladder, i=L.findIndex(e=>e.me); let idx=[];
  for(let j=Math.max(0,i-6);j<i;j++) idx.push(j);
  if(idx.length<3) for(let j=i+1;j<L.length&&idx.length<3;j++) idx.push(j);
  idx=idx.sort(()=>Math.random()-.5).slice(0,3).sort((a,b)=>a-b);
  return idx.map(j=>{ const e=L[j]; if(e.real){ const st=REAL[e.cid]; if(st){ const f=heroFighter(st); f.id=e.id; f.rank=j+1; return f; } }
    const f=genFighter(e.name||'Ismeretlen',entryLevel(e),.9+Math.random()*.12,e.cls||'kidobo'); f.id=e.id; f.rank=j+1; return f; });
}

/* ================= combat ================= */
function strike(att, def, followUp){
  const ac=CLASSES[att.cls], dc=CLASSES[def.cls], mag=att.cls==='magus';
  if(!mag && Math.random()<MISS) return {dmg:0,miss:true};
  const af=att.fx||{}, df=def.fx||{}, dodge=Math.min(FX_CAP.dodge,(dc.dodge||0)+(df.dodge||0)), block=Math.min(FX_CAP.block,(dc.block||0)+(df.block||0)), pierce=af.pierce||0;
  if(!mag && dodge && Math.random()<dodge) return {dmg:0,dodge:true};
  if(!mag && !followUp && block && Math.random()<block) return {dmg:0,block:true}; // a quick follow-up stab slips past the shield
  const m=ac.main;
  let dmg = (rand(att.wMin, att.wMax) + att.stats[m]*STAT_DMG) * ac.dmg * (1 - resist(def.stats[m], def.level)*(1-pierce)) * (1+(af.dmg||0));
  if(att.cls!=='magus') dmg *= 1-armorRed(def)*(1-pierce);
  const crit=Math.random()<critChance(att); if(crit) dmg*=2+(af.critx||0);
  return {dmg:Math.max(1,Math.round(dmg)), crit};
}
function simulate(a,b){
  const fa=a.fx||{}, fb=b.fx||{}, mA=a.maxHp||a.hp, mB=b.maxHp||b.hp;
  let hA=a.hp, hB=b.hp, t=Math.random()<.5+(fa.first||0)-(fb.first||0)?0:1, log=[], n=0;
  while(hA>0 && hB>0 && n<300){ const att=t?b:a, def=t?a:b, af=att.fx||{}, df=def.fx||{}, hits=(CLASSES[att.cls].hits||1)+(af.extra&&Math.random()<af.extra?1:0);
    for(let h=0;h<hits&&hA>0&&hB>0;h++){ const r=strike(att, def, h>0);
      if(t) hA=Math.max(0,hA-r.dmg); else hB=Math.max(0,hB-r.dmg);
      // talents: life steal for the attacker, thorns back at them
      if(r.dmg>0&&af.leech){ const g=Math.round(r.dmg*af.leech); if(t) hB=Math.min(mB,hB+g); else hA=Math.min(mA,hA+g); r.heal=g; }
      if(r.dmg>0&&df.thorns&&(t?hA:hB)>0){ const th=Math.max(1,Math.round(r.dmg*df.thorns)); if(t) hB=Math.max(0,hB-th); else hA=Math.max(0,hA-th); r.thorns=th; }
      log.push({...r, side:t, hA, hB, extra:h>0}); n++; }
    t=1-t; }
  // a fight always ends with a knockout: if it drags on, the one in worse shape runs out of breath
  if(hA>0&&hB>0){ const aWins=hA/(a.maxHp||a.hp)>=hB/(b.maxHp||b.hp); if(aWins){ log.push({dmg:hB,side:0,hA,hB:0,finish:true}); hB=0; } else { log.push({dmg:hA,side:1,hA:0,hB,finish:true}); hA=0; } }
  return {log, win: hB<=0};
}

function skillFx(st){ const fx={}, sk=st&&st.skills||[], T=SKILLS[st&&st.cls]||[]; sk.forEach((c,i)=>{ if(c==null||!T[i]) return; for(const [k,v] of Object.entries(T[i][c].fx)) fx[k]=(fx[k]||0)+v; }); return fx; }

function skillsCard(){ const fx=skillFx(state), op=skillOpen()>=0, n=(state.skills||[]).filter(x=>x!=null).length, av=SKILL_LV.filter(l=>l<=state.level).length;

function gainXp(x){
  track('xp',x); state.xp+=x; let ups=0; const from=state.level, hpFrom=maxHp(effStats().con,from,state.cls);
  while(state.xp>=xpNeed(state.level)){ state.xp-=xpNeed(state.level); state.level++; ups++; }
  if(ups) lvlGain(state,ups);
  if(ups){ state.pog=(state.pog||0)+ups; state.freeReshop=true; state.arena=genArena(); lvlFx={pog:(lvlFx?lvlFx.pog||0:0)+ups, from:lvlFx?lvlFx.from:from, hpFrom:lvlFx?lvlFx.hpFrom:hpFrom, to:state.level, hpTo:maxHp(effStats().con,state.level,state.cls)}; }
}
function addItem(it){ if(state.inv.length>=INV_MAX){ state.gold+=Math.round(it.price*.4); return false; } state.inv.push(it); return true; }
/* ---- save slots: every hero is kept, the roster remembers who was played last ---- */
const ROSTER_KEY='ejjeli-jarat-roster', CHAR_PREFIX='ejjeli-jarat-char-', MAX_CHARS=6;
function readRoster(){ try{ const r=JSON.parse(localStorage.getItem(ROSTER_KEY)||'null'); if(r&&Array.isArray(r.ids)) return r; }catch(e){} return {current:null,ids:[]}; }
function writeRoster(r){ try{ localStorage.setItem(ROSTER_KEY,JSON.stringify(r)); }catch(e){} }
function readChar(id){ try{ const s=localStorage.getItem(CHAR_PREFIX+id); return s?JSON.parse(s):null; }catch(e){ return null; } }
function save(){
  if(!state) return;
  if(state._g==null) state._g=state.gold; if(state.gold>state._g) track('gold',state.gold-state._g); state._g=state.gold;
  if(!state.cid) state.cid=(crypto.randomUUID?crypto.randomUUID():uid()+uid()+uid());
  state.rev=(state.rev||0)+1;
  state.savedAt=now();
  try{ localStorage.setItem(CHAR_PREFIX+state.cid, JSON.stringify(state)); }catch(e){}
  const r=readRoster(); if(!r.ids.includes(state.cid)) r.ids.push(state.cid); r.current=state.cid; writeRoster(r);
  cloudSave(state);
}
function load(){
  let r=readRoster();
  if(!r.ids.length){ // move the old single save into the roster
    try{ const old=localStorage.getItem(SAVE_KEY); if(old){ const st=JSON.parse(old); st.cid=st.cid||uid(); localStorage.setItem(CHAR_PREFIX+st.cid,JSON.stringify(st)); r={current:st.cid,ids:[st.cid]}; writeRoster(r); localStorage.removeItem(SAVE_KEY); } }catch(e){}
  }
  return r.current?readChar(r.current):null;
}
function listChars(){ return readRoster().ids.map(id=>readChar(id)).filter(Boolean).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0)); }
function leaveChar(){ save(); flushCloud(); const r=readRoster(); r.current=null; writeRoster(r); state=null; hideTip(); $('#overlay-root').innerHTML=''; battle=null; render(); window.scrollTo(0,0); }
function enterChar(id){
  const st=readChar(id); if(!st) return;
  state=migrate(st); if(!(state.arena[0]&&state.arena[0].rank)) state.arena=genArena();
  view='terkep'; lvlFx=false; syncLadder(); save(); render(); window.scrollTo(0,0);
  const fresh=(state.arenaLog||[]).filter(l=>l.at>(state.seenLog||0));
  if(fresh.length){ state.seenLog=now(); save(); toast(`${fresh.length} támadás ért az arénában, amíg távol voltál. Nézd meg az Arénában!`); }
  loadOnlineLogs(true);
}
function deleteChar(id){
  if(SB&&ONLINE.user) SB.from('characters').delete().eq('id',id).then(()=>{});
  try{ localStorage.removeItem(CHAR_PREFIX+id); }catch(e){}
  const r=readRoster(); r.ids=r.ids.filter(x=>x!==id); if(r.current===id) r.current=null; writeRoster(r); render();
}

const HAND_NAME=['Semmi','Pár','Két pár','Drill','Kissor','Nagysor','Full','Póker','Ötös'];
function handScore(d){
  const cnt={}; d.forEach(v=>cnt[v]=(cnt[v]||0)+1);
  const g=Object.entries(cnt).map(([v,c])=>[c,+v]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]), cs=g.map(x=>x[0]).join(''), vals=g.map(x=>x[1]);
  const srt=[...d].sort().join('');
  const cat=cs==='5'?8:cs==='41'?7:cs==='32'?6:srt==='23456'?5:srt==='12345'?4:cs==='311'?3:cs==='221'?2:cs==='2111'?1:0;
  return [cat,...vals];
}
function cmpScore(a,b){ for(let i=0;i<Math.max(a.length,b.length);i++){ const x=a[i]||0,y=b[i]||0; if(x!==y) return x>y?1:-1; } return 0; }
// Ica keeps her best group (or a near-straight) and rerolls the rest
function icaKeep(d){
  const sc=handScore(d); if(sc[0]>=4&&sc[0]!==7) return d.map(()=>true);
  const cnt={}; d.forEach(v=>cnt[v]=(cnt[v]||0)+1);
  const uniq=[...new Set(d)].sort(); if(Math.max(...Object.values(cnt))===1){ const hi=uniq.includes(6)&&!uniq.includes(1); const keep=new Set(hi?[2,3,4,5,6]:[1,2,3,4,5]); const used=new Set(); return d.map(v=>{ if(keep.has(v)&&!used.has(v)){ used.add(v); return true; } return false; }); }
  const keepVals=new Set(Object.entries(cnt).filter(([v,c])=>c>=2).map(([v])=>+v));
  if(sc[0]===2&&Math.random()<.5){ const lo=Math.min(...keepVals); keepVals.delete(lo); }
  return d.map(v=>keepVals.has(v));
}
let PK=null;
const die=v=>{ const P={1:[[50,50]],2:[[28,28],[72,72]],3:[[26,26],[50,50],[74,74]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[26,26],[74,26],[50,50],[26,74],[74,74]],6:[[28,24],[72,24],[28,50],[72,50],[28,76],[72,76]]}[v]||[];
  return `<svg viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="18" fill="#f4efe6" stroke="#13141f" stroke-width="5"/>${P.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="9" fill="${v===1?'#c0392b':'#13141f'}"/>`).join('')}</svg>`; };
function pokerStakes(cur){ const L=state.level; return cur==='pog'?[1,3,5]:[Math.round((20+L*10)/5)*5,Math.round((50+L*30)/10)*10,Math.round((100+L*80)/10)*10]; }

  let body='';

const r6=()=>1+Math.floor(Math.random()*6);
function pokerBet(v){
  dayReset(); if(state.pokerCount>=POKER_DAILY) return;
  if(PK.cur==='pog'){ if(!spendPog(v)) return; } else { if(state.gold<v) return toast('Nincs elég forintod.'); state.gold-=v; }
  state.pokerCount++; track('poker',1); save();
  PK={...PK,phase:'play',stake:v,me:[r6(),r6(),r6(),r6(),r6()],held:[0,0,0,0,0].map(()=>false),rolls:1,rolling:[0,1,2,3,4],ica:null,msg:''};
  sfx('clink'); renderPoker(); setTimeout(()=>{ if(PK) { PK.rolling=null; } },500);
}
function pokerRoll(){ if(PK.rolls>=3) return; const idx=[]; PK.me=PK.me.map((v,i)=>{ if(PK.held[i]) return v; idx.push(i); return r6(); }); PK.rolls++; PK.rolling=idx; sfx('clink'); renderPoker(); PK.rolling=null; if(PK.rolls>=3) setTimeout(pokerStand,700); }
function pokerStand(){
  if(!PK||PK.phase!=='play') return; PK.phase='ica'; PK.held=null; const ms=handScore(PK.me);
  PK.ica=[r6(),r6(),r6(),r6(),r6()]; PK.icaRolling=[0,1,2,3,4]; PK.msg='Ica dob…'; renderPoker(); sfx('clink');
  let n=1; const step=()=>{
    if(!PK) return;
    const beat=cmpScore(handScore(PK.ica),ms)>0;
    if(n<3&&!beat){ const k=icaKeep(PK.ica), idx=[]; PK.ica=PK.ica.map((v,i)=>{ if(k[i]) return v; idx.push(i); return r6(); }); n++; PK.icaRolling=idx; PK.msg=`Ica újradob (${idx.length} kocka)…`; sfx('clink'); renderPoker(); setTimeout(step,1100); return; }
    const c=cmpScore(ms,handScore(PK.ica)), pog=PK.cur==='pog';
    if(c>0){ track('poker_win',1); if(pog) state.pog+=PK.stake*2; else state.gold+=PK.stake*2; PK.msg=`<b class="win">Nyertél! +${pog?PK.stake*2+' pogácsa':fmt(PK.stake*2)+' Ft'}</b>`; sfx('win'); }
    else if(c===0){ if(pog) state.pog+=PK.stake; else state.gold+=PK.stake; PK.msg='Döntetlen, visszakaptad a téted.'; sfx('pop'); }
    else { PK.msg=`<b class="lose">Ica nyert.</b> „Legközelebb, drágám.”`; sfx('lose'); }
    PK.phase='done'; PK.icaRolling=null; save(); render(); renderPoker(); };
  setTimeout(step,1100);
}

function mkTask(T){ const n=T.n(), arg=T.arg?T.arg():null; return {id:T.id,ev:T.ev,n,arg,p:0,done:false,claimed:false,txt:T.t(n,arg),d:T.d||1}; }
function tasksReset(){
  if(!state) return;
  if(!state.daily||state.daily.day!==todayKey()){ const prev=new Set((state.daily&&state.daily.tasks||[]).map(t=>t.id));
    let pool=TASKS.filter(T=>(!T.ok||T.ok())&&!prev.has(T.id)), out=[];
    // one bigger task, two smaller ones
    const hard=pool.filter(T=>T.d>=2); if(hard.length){ const h=pick(hard); out.push(h); pool=pool.filter(T=>T!==h); }
    while(out.length<3&&pool.length){ const t=pick(pool); out.push(t); pool=pool.filter(T=>T!==t); }
    state.daily={day:todayKey(),tasks:out.map(mkTask),bonus:false}; }
  if(!state.weekly||state.weekly.week!==weekKey()){ const prev=state.weekly&&state.weekly.task&&state.weekly.task.id;

function track(ev,n=1,arg){

function dayKeyOffset(n){ const d=new Date(); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function loginInfo(){ const L=state.login||{}; const today=todayKey(), yest=dayKeyOffset(-1);
  if(L.last===today) return {claimed:true,day:L.streak};             // already taken today
  const next=L.last===yest?(L.streak%7)+1:1; return {claimed:false,day:next,broke:!!L.last&&L.last!==yest&&L.streak>0}; }
function claimLogin(){ const I=loginInfo(); if(I.claimed) return; const D=LOGIN_DAYS[I.day-1], v=D.v();

/* ================= city boss: one giant monster a week, everybody hits the same life pool ================= */
const CITY_BOSSES=[
  {id:'nyugati', name:'A Nyugati Lidérce', art:'boss_palyaudvar', desc:'Az Eiffel-féle csarnok vasszerkezetéből mászott elő, és minden vonatot lekésett, ami valaha elindult.'},
  {id:'oroszlan',name:'A Nyelvtelen Oroszlán Bosszúja', art:'boss_hid', desc:'Kétszáz év gúnyolódás után megelégelte. Lemászott a Lánchídról, és mindenkit megharap, aki nyelvet ölt rá.'},
  {id:'fantom',  name:'Az Operaház Kisebbik Fantomja', art:'boss_opera', desc:'A nagyobbik már nyugdíjas. Ez minden előadást leállít, és visszaköveteli a jegyárat.'},
  {id:'metro',   name:'A Négyes Metró Sárkánya', art:'boss_metro', desc:'Huszonöt évig épült az alagútja, most kiköltözött belőle. Pontosan érkezik, de nem jó helyre.'},
  {id:'paprika', name:'A Vásárcsarnok Paprikagólemje', art:'boss_csarnok', desc:'Kalocsai fűszerpaprikából gyúrták. Csíp, ég, és a turisták fotózzák, amíg széttapos mindent.'},
  {id:'patkany', name:'A Nagykörúti Patkánykirály', art:'boss_csatorna', desc:'A csatornahálózat ura feljött a felszínre, mert a hatos villamos megint nem jött.'}
];
const BOSS_FREE=3, BOSS_PAID=5, BOSS_HP_BASE=10000, BOSS_HP_PER_LVL=3400; // sized so one player alone needs about a week of free hits
// every class should matter about the same against the city boss
const BOSS_CLS={kidobo:1.4,magus:1.3,futar:.72,zsebmetszo:.7};
function weekIndex(){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return Math.round(d.getTime()/604800000); }
function cityBoss(){ return CITY_BOSSES[((weekIndex()%CITY_BOSSES.length)+CITY_BOSSES.length)%CITY_BOSSES.length]; }
function weekLeft(){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)+7); return d.getTime()-now(); }
function bossDay(){ const b=state.boss||(state.boss={}); if(b.day!==todayKey()){ b.day=todayKey(); b.used=0; b.paid=0; } return b; }
function bossFreeLeft(){ return state?Math.max(0,BOSS_FREE-bossDay().used):0; }
/* offline: the rest of the city is simulated by the heroes of the ladder */
function bossBoard(){
  const wk=weekKey(), frac=Math.min(1,Math.max(.02,1-weekLeft()/604800000));
  const rows=state.ladder.filter(e=>!e.me&&!e.real).slice(0,16).map(e=>{ const L=entryLevel(e); return withSeed(e.id+wk,()=>({key:e.id,name:e.name,cls:e.cls,level:L,dmg:Math.round(L*BOSS_HP_PER_LVL*.82*frac*(.5+Math.random()))})); });
  const mine=(state.bossDmg&&state.bossDmg[wk])||0; if(mine) rows.push({key:'me',name:state.name,cls:state.cls,level:state.level,dmg:mine,me:true});
  return bossBoardOf(rows);
}
function bossBoardOf(rows){ rows.sort((a,b)=>b.dmg-a.dmg); const total=rows.reduce((a,r)=>a+r.dmg,0), max=BOSS_HP_BASE+rows.reduce((a,r)=>a+r.level*BOSS_HP_PER_LVL,0)+(rows.some(r=>r.me)?0:state.level*BOSS_HP_PER_LVL);
  return {rows,total,max,dead:total>=max,hp:Math.max(0,max-total),meIdx:rows.findIndex(r=>r.me)}; }
function recordBossHit(dealt){ const wk=weekKey(); state.bossDmg=state.bossDmg||{}; state.bossDmg[wk]=(state.bossDmg[wk]||0)+dealt; for(const k of Object.keys(state.bossDmg)) if(k!==wk&&k!==state.bossLastWk) delete state.bossDmg[k]; save(); }
function bossFighter(){ const B=cityBoss(), f=genFighter(B.name,state.level+2,1.25,'kidobo'); f.art=ENEMY_ART[B.art]; return f; }
function bossAttack(pay){
  const b=bossDay(), board=bossBoard(); if(board.dead) return;
  if(b.used<BOSS_FREE) b.used++; else { if(!pay||b.paid>=BOSS_PAID||!spendPog(1)) return; b.paid++; }
  const me=playerFighter(), boss=bossFighter(), bdef={...boss,cls:'magus',armor:0}, pool=board.hp, cf=BOSS_CLS[state.cls]||1; let hA=me.hp, dealt=0, t=Math.random()<.5?0:1; const log=[];
  // the boss has no armour or shield; you keep hitting until 20 blows or until it knocks you out
  for(let n=0;n<40&&hA>0;n++){ const att=t?boss:me, hits=CLASSES[att.cls].hits||1;
    for(let h=0;h<hits&&hA>0;h++){ const r=strike(att,t?me:bdef,h>0); if(!t) r.dmg=Math.round(r.dmg*cf); if(t) hA=Math.max(0,hA-r.dmg); else dealt+=r.dmg; log.push({...r,side:t,hA,hB:Math.max(0,pool-dealt),extra:h>0}); }
    t=1-t; }
  dealt=Math.min(dealt,pool);
  const g=Math.round((5+state.level*3)*goldMult()), x=Math.max(5,Math.round(xpNeed(state.level)*.015*xpMult()));
  state.gold+=g; gainXp(x); recordBossHit(dealt); track('boss',1);
  const disp={...boss,hp:Math.max(1,pool)};
  BATTLE_BG='varos'; openBattle(me,disp,{log,win:true,boss:true,dealt,dead:dealt>=pool},`<span class="chip">${ic('coin','ic-gold')}+${fmt(g)} Ft</span><span class="chip">${ic('xp','ic-xp')}+${fmt(x)} XP</span>`);
}
function bossReward(rank){ return {pog:rank===0?10:rank<3?5:rank<10?3:1, gold:Math.round((200+state.level*50)*goldMult())}; }
function claimBoss(){ const wk=weekKey(), board=bossBoard(); state.bossClaimed=state.bossClaimed||{}; if(!board.dead||board.meIdx<0||state.bossClaimed[wk]) return;
  const r=bossReward(board.meIdx); state.bossClaimed[wk]=true; state.chests=(state.chests||0)+1; state.pog=(state.pog||0)+r.pog; state.gold+=r.gold; save(); render(); sfx('levelup');
  toast(`Jutalom: Heti láda, +${r.pog} pogácsa, +${fmt(r.gold)} Ft! A ládát a Kocsmában, a Feladatoknál nyithatod ki.`); }
function bossReady(){ if(!state||state.level<1) return false; const B=bossBoard(); return (!B.dead&&bossFreeLeft()>0)||(B.dead&&B.meIdx>=0&&!(state.bossClaimed||{})[weekKey()]); }
function renderBoss(){
  const B=cityBoss(), board=bossBoard(), b=bossDay(), free=BOSS_FREE-b.used, paid=BOSS_PAID-b.paid, wk=weekKey(), claimed=(state.bossClaimed||{})[wk];
  const pct=Math.max(0,board.hp/board.max*100), me=board.meIdx>=0?board.rows[board.meIdx]:null;
  let html=arenaBar()+`<section class="card boss-card ${board.dead?'dead':''}"><div class="boss-head">${portrait(ENEMY_ART[B.art],'boss-port')}<div><span class="label">${ic('pin')}A heti városi főgonosz</span><h2>${esc(B.name)}</h2><p class="muted">${esc(B.desc)}</p></div></div>
    <div class="boss-hp"><i style="width:${pct}%"></i><span class="mono">${board.dead?'LEGYŐZVE!':`${fmt(board.hp)} / ${fmt(board.max)}`}</span></div>
    <div class="row between note"><span>${ic('user')} ${board.rows.length} hős harcol ellene</span><span>${ic('clock')} még ${fmtLeft(weekLeft())}</span></div></section>`;
  if(board.dead){
    if(me&&!claimed){ const r=bossReward(board.meIdx); html+=`<section class="card boss-win"><h3>${ic('trophy')}A város győzött!</h3><p>A ${board.meIdx+1}. lettél a sebzési listán. A jutalmad: <b>Heti láda</b>, <b>+${r.pog} pogácsa</b> és <b>${fmt(r.gold)} Ft</b>.</p><button class="btn primary" data-act="bossclaim" style="width:100%">Jutalom átvétele</button></section>`; }
    else html+=`<section class="card"><p class="muted" style="margin:0">${me?'Átvetted a jutalmad. Hétfőn új főgonosz érkezik.':'Ezen a héten lemaradtál. Hétfőn új főgonosz érkezik, akkor szállj be te is!'}</p></section>`;
  } else {
    html+=`<section class="card row between"><div><div class="label">${ic('fight')}Csapások ma</div><div class="note">${free>0?`${free}/${BOSS_FREE} ingyen`:`ingyen elfogyott · pogácsáért még ${paid}/${BOSS_PAID}`}</div></div>
      ${free>0?`<button class="btn primary" data-act="bosshit">${ic('fight')}Lecsapok</button>`:`<button class="btn pog-btn" data-act="bosshit" data-pog="1" ${paid<=0||(state.pog||0)<1?'disabled':''}>${pogIc()}1 · Lecsapok</button>`}</section>`;
  }
  html+=`<section class="card"><div class="row between" style="margin-bottom:8px"><span class="label">${ic('trophy')}Sebzési lista</span>${me?`<span class="note">te: ${board.meIdx+1}. · ${fmt(me.dmg)}</span>`:''}</div><div class="ladder">`;
  const show=new Set(board.rows.slice(0,10).map((_,i)=>i)); if(board.meIdx>=10) show.add(board.meIdx); let prev=-1;
  [...show].sort((a,b)=>a-b).forEach(i=>{ const r=board.rows[i]; if(i>prev+1) html+=`<div class="lad-gap">···</div>`; prev=i;
    html+=`<div class="lad-row ${r.me?'me':''}"><span class="lad-rank r${i<3?i+1:0}">${i+1}</span>${portrait(CLASS_ART[r.cls]||CLASS_ART.kidobo,'lad-port')}<span class="lad-name">${esc(r.name)}${r.me?' <em>te</em>':''}</span><span class="lad-lvl mono">${fmt(r.dmg)}</span></div>`; });
  if(!board.rows.length) html+=`<p class="muted">Még senki nem csapott le rá. Legyél te az első!</p>`;
  html+=`</div></section><section class="card"><span class="label">${ic('box')}Ha a város legyőzi</span><p class="note" style="margin:6px 0 0">Mindenki, aki legalább egyszer lecsapott, kap egy <b>Heti ládát</b> és forintot. Pogácsa a helyezés szerint: 1. hely +10, 2–3. hely +5, 4–10. hely +3, mindenki más +1. Minden csapás után azonnal kapsz egy kis forintot és XP-t is. A jutalmat a hét végéig vedd át!</p></section>`;
  return html;
}


/* ================= mailbox, friends and guild chat =================
   offline these travel between the heroes saved on this device; the online build swaps in the server */
function sendMsg(toKey,body,kind='dm'){ body=String(body||'').trim().slice(0,500); if(!body) return false; const cid=toKey.replace(/^[cp]-/,''), h=realData(cid); if(!h) return false;
  const m={id:uid(),at:now(),kind,fromKey:'c-'+state.cid,from:state.name,fromCls:state.cls,toKey:'c-'+cid,to:h.name,body};
  h.inbox=(h.inbox||[]).concat(m).slice(-100); writeOther(h); if(kind==='dm'){ state.outbox=(state.outbox||[]).concat(m).slice(-100); save(); } return true; }
function mailItems(){
  const out=(state.inbox||[]).map(m=>({...m,k:m.kind}));
  (state.arenaLog||[]).forEach(l=>out.push({id:'a'+l.at,at:l.at,k:'arena',from:l.by,body:l.won?'megtámadott az arénában, de visszavertél.':'legyőzött az arénában.',won:l.won}));
  return out.sort((a,b)=>b.at-a.at); }
function threadWith(key){ return [...(state.inbox||[]).filter(m=>m.kind==='dm'&&m.fromKey===key),...(state.outbox||[]).filter(m=>m.toKey===key)].sort((a,b)=>a.at-b.at); }
function mailUnread(){ if(!state) return 0; const seen=state.mailSeen||0; return mailItems().filter(m=>m.at>seen).length; }
function friendInfo(f){ const d=realData(f.cid); return d?{...f,name:d.name,cls:d.cls,level:d.level}:f; }
function isFriend(cid){ return (state.friends||[]).some(f=>f.cid===cid); }
function addFriend(key,name,cls){ const cid=key.replace(/^[cp]-/,''); if(cid===state.cid||isFriend(cid)) return; state.friends=(state.friends||[]).concat({cid,key,name,cls}); save(); Promise.resolve(sendMsg(key,`${state.name} felvett a barátai közé.`,'friend')); toast(`${name} a barátaid között.`); }
function removeFriend(cid){ state.friends=(state.friends||[]).filter(f=>f.cid!==cid); save(); }
function guildChannel(){ return state.guild?state.cid:state.memberOf?state.memberOf.leaderCid:null; }
function guildChat(){ const ch=guildChannel(); if(!ch) return []; const L=ch===state.cid?state:realData(ch); return (L&&L.guild&&L.guild.chat)||[]; }
function sendGuildMsg(body){ body=String(body||'').trim().slice(0,300); const ch=guildChannel(); if(!body||!ch) return false; const m={id:uid(),at:now(),from:state.name,fromCls:state.cls,fromKey:'c-'+state.cid,body};
  if(ch===state.cid){ state.guild.chat=(state.guild.chat||[]).concat(m).slice(-60); save(); } else { const L=realData(ch); if(!L||!L.guild) return false; L.guild.chat=(L.guild.chat||[]).concat(m).slice(-60); writeOther(L); } return true; }
const MAIL_NOTE='Itt látod, ha írt valaki, ha megtámadtak az arénában, vagy ha meghívtak egy céhbe.';
const tAgo=t=>{ const m=Math.round((now()-t)/60000); return m<1?'most':m<60?`${m} perce`:m<1440?`${Math.round(m/60)} órája`:new Date(t).toLocaleDateString('hu-HU',{month:'short',day:'numeric'}); };
/* ---- guild chat ---- */
function chatMsgs(){ const L=guildChat(); if(!L.length) return `<p class="muted" style="margin:6px 0">Még csend van. Köszönj a céhnek!</p>`;
  return L.slice(-40).map(m=>`<div class="cmsg ${m.fromKey==='c-'+state.cid?'me':''}">${portrait(CLASS_ART[m.fromCls]||CLASS_ART.kidobo,'cmsg-p')}<div><div class="cmsg-h"><b>${esc(m.from)}</b><span class="note">${tAgo(m.at)}</span></div><div class="cmsg-b">${esc(m.body)}</div></div></div>`).join(''); }
function chatBox(){ setTimeout(()=>{ const el=$('#gchat'); if(el) el.scrollTop=1e6; },0);
  return `<section class="card gchat"><div class="row between" style="margin-bottom:6px"><span class="label">${ic('chat')}Céhes chat</span></div><div class="gchat-list" id="gchat">${chatMsgs()}</div>
    <div class="chat-in"><input id="gmsg" maxlength="300" placeholder="Írj a céhnek…" autocomplete="off"><button class="btn small primary" data-act="gsend" aria-label="Küldés">${ic('send')}</button></div></section>`; }
function refreshChat(){ const el=$('#gchat'); if(el){ const atEnd=el.scrollHeight-el.scrollTop-el.clientHeight<40; el.innerHTML=chatMsgs(); if(atEnd) el.scrollTop=1e6; } const th=$('#mthread'); if(th&&MAIL.tab==='thread'){ th.innerHTML=threadHtml(); th.scrollTop=1e6; } }
async function doGuildSend(){ const i=$('#gmsg'); if(!i||!i.value.trim()) return; const v=i.value; i.value=''; const ok=await sendGuildMsg(v); if(ok===false){ i.value=v; return toast('Nem sikerült elküldeni.'); } refreshChat(); const el=$('#gchat'); if(el) el.scrollTop=1e6; i.focus(); }
/* ---- mailbox ---- */
let MAIL={tab:'posta'};
function mailBtn(){ const n=mailUnread(); return `<button class="chip snd mail-btn" data-act="openmail" title="Postaláda" aria-label="Postaláda${n?`, ${n} új`:''}">${ic('mail')}${n?`<span class="mail-badge" id="mailbadge">${n>9?'9+':n}</span>`:''}</button>`; }
function openMail(tab,key,name){ MAIL={tab:tab||'posta',key,name}; if(MAIL.tab==='posta'){ state.mailSeen=now(); save(); } renderMail(); }
function threadHtml(){ const T=threadWith(MAIL.key); if(!T.length) return `<p class="muted" style="text-align:center;margin:20px 0">Még nem írtatok egymásnak.</p>`;
  return T.map(m=>`<div class="bub ${m.fromKey==='c-'+state.cid?'me':''}"><div>${esc(m.body)}</div><span class="note">${tAgo(m.at)}</span></div>`).join(''); }
function renderMail(){

const RAID_BOSSES=[['A Pincebörtön Őre','boss_pince'],['A Gőzfürdő Gőzszelleme','boss_furdo'],['A Szoborpark Óriása','boss_szobor'],['A Fogaskerekű Démona','boss_vasut'],['A Tévétorony Árnya','boss_torony'],

const RAID_FREE=2, RAID_PAID=3, RAID_HP0=40000, RAID_GROW=1.35;
function raidBoss(i){ const b=RAID_BOSSES[i%RAID_BOSSES.length], round=Math.floor(i/RAID_BOSSES.length); return {i,name:(round?`${round+1}. visszatérő `:'')+b[0],art:b[1],hp:Math.round(RAID_HP0*Math.pow(RAID_GROW,i))}; }

function raidRows(){ const L=raidLeader(), R=(L&&L.guild&&L.guild.raid)||{}; const rows=Object.entries(R.hits||{}).map(([k,v])=>({key:k,...v,me:k===state.cid}));

function raidState(){ RAID_KC.at=0;
  return raidStateRaw(); }
function raidStateRaw(){ const rows=raidRows().sort((a,b)=>b.dmg-a.dmg), total=rows.reduce((a,r)=>a+r.dmg,0); let i=0, acc=0; while(acc+raidBoss(i).hp<=total){ acc+=raidBoss(i).hp; i++; }
  const B=raidBoss(i); return {rows,total,idx:i,boss:B,done:total-acc,hp:B.hp-(total-acc),me:rows.find(r=>r.me)}; }
function raidDay(){ const r=state.raidDay||(state.raidDay={}); if(r.day!==todayKey()){ r.day=todayKey(); r.used=0; r.paid=0; } return r; }
function raidSave(fn){ const L=raidLeader(); if(!L||!L.guild) return false; L.guild.raid=L.guild.raid||{hits:{},bots:0}; L.guild.raid.hits=L.guild.raid.hits||{}; fn(L.guild.raid); if(L===state) save(); else writeOther(L); return true; }
function recordRaidHit(dealt){ raidSave(R=>{ const h=R.hits[state.cid]||(R.hits[state.cid]={name:state.name,cls:state.cls,dmg:0}); h.dmg+=dealt; h.name=state.name; }); }
function raidBots(){ // the leader's bot members join in whenever the leader attacks
  if(!state.guild) return 0; const add=state.guild.members.filter(m=>!m.real).reduce((a,m)=>a+memberLevel(m)*40,0); if(add){ state.guild.raid=state.guild.raid||{hits:{},bots:0}; state.guild.raid.bots=(state.guild.raid.bots||0)+add; save(); } return add; }
function raidAttack(pay){
  const d=raidDay(), st=raidState(); if(!guildChannel()) return;

}
